[package]
name = "fluxheim-acme"
version = "1.7.0"
edition = "2024"
rust-version = "1.96.1"
license = "EUPL-1.2"
publish = false
description = "Internal Fluxheim ACME account, challenge, renewal, and certificate storage logic."

[features]
default = []
acme-client = [
    "dep:base64-ng",
    "dep:rcgen",
    "instant-acme/hyper-rustls",
]

[dependencies]
base64-ng = { version = "1.2.3", optional = true }
fluxheim-config = { path = "../fluxheim-config", features = ["acme"] }
instant-acme = { version = "0.8.5", default-features = false, features = ["ring"] }
log = "0.4.33"
rcgen = { version = "0.14.8", default-features = false, features = ["pem", "ring"], optional = true }
rustix = { version = "1.1.4", features = ["fs", "process"] }
sanitization = { version = "1.2.2", features = ["alloc"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
toml = "1.1.2"
x509-parser = { version = "0.18.1", default-features = false }
zeroize = { version = "1.8.2", features = ["derive"] }

[dev-dependencies]
fluxheim-common = { path = "../fluxheim-common", features = ["test-support"] }
proptest = "1.9.0"
tokio = { version = "1.52.3", default-features = false, features = ["rt", "time"] }
