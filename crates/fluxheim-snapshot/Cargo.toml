[package]
name = "fluxheim-snapshot"
version = "1.7.11"
edition = "2024"
rust-version = "1.97.0"
license = "EUPL-1.2"
publish = false
description = "Internal Fluxheim configuration snapshot store."

[dependencies]
fluxheim-config = { path = "../fluxheim-config" }
rustix = { version = "1.1.4", features = ["fs"] }
sanitization = { version = "1.2.4", features = ["alloc"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"

[dev-dependencies]
fluxheim-common = { path = "../fluxheim-common", features = ["test-support"] }
fluxheim-config = { path = "../fluxheim-config", features = ["test-support"] }
ring = "0.17.14"
