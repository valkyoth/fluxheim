[package]
name = "fluxheim-snapshot"
version = "1.8.2"
edition = "2024"
rust-version = "1.98.0"
license = "EUPL-1.2"
publish = false
description = "Internal Fluxheim configuration snapshot store."

[dependencies]
fluxheim-config = { path = "../fluxheim-config" }
rustix = { version = "1.1.4", features = ["fs", "process"] }
sanitization = { version = "2.0.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"

[dev-dependencies]
fluxheim-common = { path = "../fluxheim-common", features = ["test-support"] }
fluxheim-config = { path = "../fluxheim-config", features = ["test-support"] }
ring = "0.17.14"

[target.'cfg(windows)'.dev-dependencies]
dunce = "1.0.5"
