[package]
name = "fluxheim-common"
version = "1.9.0"
edition = "2024"
rust-version = "1.99.1"
license = "EUPL-1.2"
publish = false
description = "Shared internal Fluxheim primitives."

[features]
test-support = ["dep:windows-permissions"]

[dependencies]
thiserror = "2.0.21"

[target.'cfg(windows)'.dependencies]
windows-permissions = { version = "0.2.4", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.5", features = ["process"] }
