[package]
name = "fluxheim-load-balancer"
version = "1.9.0"
edition = "2024"
rust-version = "1.99.1"
license = "EUPL-1.2"
publish = false
description = "Internal Fluxheim load-balancer core."

[features]
metrics = []
privacy-mode = []
test-support = ["fluxheim-common/test-support"]
tls-rustls-backend = ["dep:rustls", "dep:rustls-native-certs", "dep:tokio-rustls", "rustls/ring", "tokio-rustls/ring"]
tls-openssl-backend = ["dep:openssl", "dep:tokio-openssl"]

[dependencies]
arc-swap = "1.9.3"
async-trait = "0.1.92"
base64-ng = "2.1.0"
bytes = "1.12.1"
crc32fast = "1.5.3"
fluxheim-common = { path = "../fluxheim-common" }
fluxheim-config = { path = "../fluxheim-config", features = ["load-balancer", "proxy"] }
fluxheim-runtime = { path = "../fluxheim-runtime" }
futures = "0.3.34"
getrandom = "0.4.3"
h2 = "0.4.20"
http = "1.5.0"
log = "0.4.34"
openssl = { version = "0.10.81", optional = true }
ring = "0.17.14"
rustls = { version = "0.23.46", optional = true, default-features = false, features = ["std", "tls12", "logging"] }
rustls-native-certs = { version = "0.8.5", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sanitization = { version = "2.1.1", features = ["alloc"] }
tempfile = "3.27.0"
tokio = { version = "1.54.0", default-features = false, features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-openssl = { version = "0.6.5", optional = true }
tokio-rustls = { version = "0.26.6", optional = true, default-features = false, features = ["logging", "tls12"] }
ureq = { version = "3.5.0", default-features = false, features = ["json", "rustls"] }
zeroize = "1.9.1"

[dev-dependencies]
fluxheim-common = { path = "../fluxheim-common", features = ["test-support"] }
proptest = "1.12.0"
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "logging", "ring"] }
