[package]
name = "fluxheim-config"
version = "1.8.2"
edition = "2024"
rust-version = "1.98.0"
license = "EUPL-1.2"
publish = false
description = "Internal Fluxheim configuration schema, parsing, and validation."

[features]
acme = []
cache = []
geoip = []
load-balancer = []
metrics-otlp = []
otel-otlp = []
otel-tracing = []
php-fpm = []
privacy-mode = []
proxy = []
stream-proxy = []
test-support = []
tls-openssl = []
tls-openssl-fips = []
tls-rustls-backend = []
tls-rustls-fips = []
traffic-mirror = []
udp-proxy = []
wasm = ["dep:fluxheim-wasm"]
wasm-proxy-abi = ["wasm", "fluxheim-wasm/proxy-abi"]
wasm-wasi = ["wasm", "fluxheim-wasm/wasi"]

[dependencies]
fluxheim-protocol = { path = "../fluxheim-protocol" }
fluxheim-wasm = { path = "../fluxheim-wasm", optional = true }
log = "0.4.34"
regex = "1.13.1"
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"

[dev-dependencies]
fluxheim-common = { path = "../fluxheim-common", features = ["test-support"] }
proptest = "1.11.0"
