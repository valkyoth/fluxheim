[package]
name = "fluxheim-cache"
version = "1.8.0"
edition = "2024"
rust-version = "1.97.0"
license = "EUPL-1.2"
publish = false
description = "Internal Fluxheim cache policy and storage boundary."

[dependencies]
async-trait = "0.1.91"
bytes = "1.12.1"
fluxheim-config = { path = "../fluxheim-config" }
getrandom = "0.4.3"
http = "1.4.2"
rustix = { version = "1.1.4", features = ["fs"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
