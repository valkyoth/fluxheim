[package]
name = "fluxheim-observability"
version = "1.5.20"
edition = "2024"
rust-version = "1.96"
license = "EUPL-1.2"
publish = false
description = "Internal Fluxheim observability and trace context boundary."

[features]
default = []
otlp-http = ["dep:ureq"]
otlp-trace = ["dep:fluxheim-config", "dep:serde_json", "otlp-http"]

[dependencies]
fluxheim-config = { path = "../fluxheim-config", optional = true }
getrandom = "0.4.2"
log = "0.4.32"
serde_json = { version = "1.0.150", optional = true }
ureq = { version = "3.3.0", default-features = false, features = ["json", "rustls"], optional = true }

[dev-dependencies]
fluxheim-common = { path = "../fluxheim-common", features = ["test-support"] }
