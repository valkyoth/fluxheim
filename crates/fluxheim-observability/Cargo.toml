[package]
name = "fluxheim-observability"
version = "1.9.0"
edition = "2024"
rust-version = "1.99.1"
license = "EUPL-1.2"
publish = false
description = "Internal Fluxheim observability and trace context boundary."

[features]
default = []
structured-events = ["dep:serde", "dep:serde_json"]
test-support = ["structured-events"]
privacy-mode = []
metrics-secret = ["dep:fluxheim-config", "dep:rustix", "dep:sanitization", "dep:zeroize"]
otlp-http = ["dep:rustix", "dep:ureq"]
otlp-metrics = ["dep:prometheus", "dep:serde_json"]
otlp-trace = ["dep:fluxheim-config", "dep:serde_json", "otlp-http"]

[dependencies]
fluxheim-config = { path = "../fluxheim-config", optional = true }
getrandom = "0.4.3"
log = { version = "0.4.34", features = ["kv"] }
prometheus = { version = "0.14.0", optional = true }
rustix = { version = "1.1.5", features = ["fs"], optional = true }
sanitization = { version = "2.1.1", features = ["alloc"], optional = true }
serde_json = { version = "1.0.154", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
ureq = { version = "3.5.0", default-features = false, features = ["json", "rustls"], optional = true }
zeroize = { version = "1.9.1", features = ["derive"], optional = true }

[dev-dependencies]
fluxheim-common = { path = "../fluxheim-common", features = ["test-support"] }
proptest = "1.12.0"
