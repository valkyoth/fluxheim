[package]
name = "fluxheim-runtime"
version = "1.6.17"
edition = "2024"
rust-version = "1.96"
license = "EUPL-1.2"
publish = false
description = "Internal Fluxheim runtime task and shutdown boundaries."

[dependencies]
async-trait = "0.1.89"
tokio = { version = "1.52.3", default-features = false, features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1.52.3", default-features = false, features = ["macros", "rt", "sync", "time"] }
