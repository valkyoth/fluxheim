[package]
name = "fluxheim-web"
version = "1.7.7"
edition = "2024"
rust-version = "1.96.1"
license = "EUPL-1.2"
publish = false
description = "Internal Fluxheim static web planning and rendering boundary."

[dependencies]
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
httpdate = "1.0.3"
percent-encoding = "2.3.2"

[dev-dependencies]
fluxheim-common = { path = "../fluxheim-common", features = ["test-support"] }
