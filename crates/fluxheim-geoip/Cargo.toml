[package]
name = "fluxheim-geoip"
version = "1.8.0"
edition = "2024"
rust-version = "1.98.0"
license = "EUPL-1.2"
publish = false
description = "Internal Fluxheim GeoIP and Geo-Context boundary."

[[example]]
name = "lookup"
required-features = ["runtime"]

[features]
default = []
runtime = ["dep:fluxheim-config", "dep:maxminddb", "dep:rustix"]

[dependencies]
fluxheim-config = { path = "../fluxheim-config", features = ["geoip"], optional = true }
log = "0.4.34"
maxminddb = { version = "0.30.3", optional = true }
rustix = { version = "1.1.4", features = ["process"], optional = true }

[dev-dependencies]
fluxheim-common = { path = "../fluxheim-common", features = ["test-support"] }
