[package]
name = "fluxheim-geoip"
version = "1.9.0"
edition = "2024"
rust-version = "1.99.0"
license = "EUPL-1.2"
publish = false
description = "Internal Fluxheim GeoIP and Geo-Context boundary."

[[example]]
name = "lookup"
required-features = ["runtime"]

[features]
default = []
runtime = ["dep:fluxheim-config", "dep:maxminddb", "dep:rustix", "dep:same-file"]

[dependencies]
fluxheim-config = { path = "../fluxheim-config", features = ["geoip"], optional = true }
log = "0.4.34"
maxminddb = { version = "0.32.0", optional = true }
rustix = { version = "1.1.5", features = ["fs", "process"], optional = true }
same-file = { version = "1.0.6", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
fluxheim-common = { path = "../fluxheim-common", features = ["test-support"] }
