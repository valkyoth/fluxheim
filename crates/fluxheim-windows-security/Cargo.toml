[package]
name = "fluxheim-windows-security"
version = "1.8.2"
edition = "2024"
rust-version = "1.98.0"
license = "EUPL-1.2"
publish = false
description = "Audited Windows filesystem capability helpers for Fluxheim."

[target.'cfg(windows)'.dependencies]
windows-permissions = "0.2.4"
windows-sys = { version = "0.61.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[target.'cfg(windows)'.dev-dependencies]
tempfile = "3.27.0"
