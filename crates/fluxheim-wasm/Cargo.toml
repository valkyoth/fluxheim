[package]
name = "fluxheim-wasm"
version = "1.7.7"
edition = "2024"
rust-version = "1.97.0"
license = "EUPL-1.2"
publish = false
description = "Internal Fluxheim sandboxed WebAssembly extension runtime boundary."

[features]
default = []
proxy-abi = []
runtime = ["dep:tokio", "dep:wasmtime"]

[[example]]
name = "wasm_sandbox_smoke"
required-features = ["runtime"]

[dependencies]
sha2 = "0.11.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", default-features = false, features = ["rt", "sync"], optional = true }
wasmtime = { version = "46.0.1", default-features = false, features = ["cranelift", "runtime", "std"], optional = true }

[dev-dependencies]
tempfile = "3.27.0"
wat = "1.253.0"
