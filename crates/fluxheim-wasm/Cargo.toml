[package]
name = "fluxheim-wasm"
version = "1.8.2"
edition = "2024"
rust-version = "1.98.0"
license = "EUPL-1.2"
publish = false
description = "Internal Fluxheim sandboxed WebAssembly extension runtime boundary."

[features]
default = []
proxy-abi = []
runtime = ["dep:tokio", "dep:wasmtime"]
wasi = ["runtime", "dep:wasmtime-wasi"]

[[example]]
name = "wasm_sandbox_smoke"
required-features = ["runtime"]

[[example]]
name = "build_policy_examples"

[dependencies]
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false, features = ["rt", "sync", "time"], optional = true }
wasmtime = { version = "48.0.1", default-features = false, features = ["cranelift", "runtime", "std"], optional = true }
wasmtime-wasi = { version = "48.0.1", default-features = false, features = ["p1"], optional = true }

[dev-dependencies]
tempfile = "3.27.0"
wat = "1.258.0"
