[package]
name = "fluxheim-compression"
version = "1.8.2"
edition = "2024"
rust-version = "1.98.1"
license = "EUPL-1.2"
publish = false
description = "Internal Fluxheim response compression boundary."

[features]
default = []
brotli = ["dep:brotli"]
gzip = ["dep:flate2"]
zstd = ["dep:zstd"]

[dependencies]
brotli = { version = "9.0.0", default-features = false, features = ["std"], optional = true }
bytes = "1.12.1"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"], optional = true }
fluxheim-common = { path = "../fluxheim-common" }
fluxheim-protocol = { path = "../fluxheim-protocol" }
zstd = { version = "0.14.0", default-features = false, optional = true }
