[package]
name = "fluxheim-stream"
version = "1.9.0"
edition = "2024"
rust-version = "1.99.0"
license = "EUPL-1.2"
publish = false
description = "Internal Fluxheim TCP stream proxy runtime boundary."

[dependencies]
fluxheim-common = { path = "../fluxheim-common" }
fluxheim-config = { path = "../fluxheim-config", features = ["stream-proxy"] }
fluxheim-protocol = { path = "../fluxheim-protocol" }
sanitization = { version = "2.1.0" }
tokio = { version = "1.53.2", features = ["io-util", "macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["test-util"] }
