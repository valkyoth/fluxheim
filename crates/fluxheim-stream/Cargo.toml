[package]
name = "fluxheim-stream"
version = "1.7.8"
edition = "2024"
rust-version = "1.97.0"
license = "EUPL-1.2"
publish = false
description = "Internal Fluxheim TCP stream proxy runtime boundary."

[dependencies]
fluxheim-common = { path = "../fluxheim-common" }
fluxheim-config = { path = "../fluxheim-config", features = ["stream-proxy"] }
fluxheim-protocol = { path = "../fluxheim-protocol" }
sanitization = { version = "1.2.4" }
tokio = { version = "1.52.3", features = ["io-util", "macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["test-util"] }
