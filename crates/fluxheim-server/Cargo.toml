[package]
name = "fluxheim-server"
version = "1.6.28"
edition = "2024"
rust-version = "1.96"
license = "EUPL-1.2"
publish = false
description = "Internal Fluxheim listener and server boundary types."

[features]
default = []
privacy-mode = []
compression = ["dep:fluxheim-compression"]
compression-brotli = ["compression", "fluxheim-compression/brotli"]
compression-gzip = ["compression", "fluxheim-compression/gzip"]
compression-zstd = ["compression", "fluxheim-compression/zstd"]
tls-rustls-backend = ["dep:rustls", "dep:rustls-native-certs", "dep:tokio-rustls", "rustls/ring"]
tls-rustls = ["tls-rustls-backend", "rustls/ring"]
tls-rustls-fips = ["tls-rustls-backend", "rustls/fips"]
tls-openssl-backend = ["dep:openssl", "dep:tokio-openssl"]
tls-openssl = ["tls-openssl-backend"]
tls-openssl-fips = ["tls-openssl"]

[dependencies]
bytes = "1.11.1"
fluxheim-common = { path = "../fluxheim-common" }
fluxheim-compression = { path = "../fluxheim-compression", optional = true }
fluxheim-config = { path = "../fluxheim-config" }
fluxheim-headers = { path = "../fluxheim-headers" }
fluxheim-protocol = { path = "../fluxheim-protocol" }
fluxheim-runtime = { path = "../fluxheim-runtime" }
fluxheim-web = { path = "../fluxheim-web" }
h2 = "0.4.15"
http = "1.4.2"
httpdate = "1.0.3"
log = "0.4.32"
openssl = { version = "0.10.81", optional = true }
percent-encoding = "2.3.2"
rustls = { version = "0.23.40", optional = true }
rustls-native-certs = { version = "0.8.3", optional = true }
tokio = { version = "1.52.3", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-openssl = { version = "0.6.5", optional = true }
tokio-rustls = { version = "0.26.4", optional = true }
zeroize = "1.8.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "net", "process"] }

[dev-dependencies]
flate2 = "1.1.5"
rcgen = { version = "0.14.8", default-features = false, features = ["pem", "ring"] }
tempfile = "3.27.0"
