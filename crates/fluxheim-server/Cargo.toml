[package]
name = "fluxheim-server"
version = "1.6.37"
edition = "2024"
rust-version = "1.96.1"
license = "EUPL-1.2"
publish = false
description = "Internal Fluxheim listener and server boundary types."

[features]
default = []
acme = []
auth-request = ["dep:ureq", "sanitization/alloc"]
openbao-cache-encryption = ["dep:serde_json", "dep:ureq", "sanitization/alloc", "ureq/json"]
privacy-mode = []
compression = ["dep:fluxheim-compression"]
compression-brotli = ["compression", "fluxheim-compression/brotli"]
compression-gzip = ["compression", "fluxheim-compression/gzip"]
compression-zstd = ["compression", "fluxheim-compression/zstd"]
load-balancer = ["dep:fluxheim-load-balancer"]
otel-tracing = ["dep:fluxheim-observability", "fluxheim-config/otel-tracing"]
php-fpm = ["dep:fastcgi-client", "dep:fluxheim-php-fpm", "tokio/fs"]
tls-rustls-backend = ["dep:fluxheim-tls", "dep:rustls", "dep:rustls-native-certs", "dep:tokio-rustls", "fluxheim-tls/tls-rustls-backend", "rustls/ring", "sanitization/alloc"]
tls-rustls = ["tls-rustls-backend", "fluxheim-tls/tls-rustls", "rustls/ring"]
tls-rustls-fips = ["tls-rustls-backend", "fluxheim-tls/tls-rustls-fips", "rustls/fips"]
tls-openssl-backend = ["dep:fluxheim-tls", "dep:openssl", "dep:tokio-openssl", "fluxheim-tls/tls-openssl", "sanitization/alloc"]
tls-openssl = ["tls-openssl-backend"]
tls-openssl-fips = ["tls-openssl"]
traffic-mirror = ["dep:ureq"]

[dependencies]
bytes = "1.11.1"
fastcgi-client = { version = "0.11.1", default-features = false, features = ["runtime-tokio"], optional = true }
fluxheim-common = { path = "../fluxheim-common" }
fluxheim-cache = { path = "../fluxheim-cache" }
fluxheim-compression = { path = "../fluxheim-compression", optional = true }
fluxheim-config = { path = "../fluxheim-config" }
fluxheim-headers = { path = "../fluxheim-headers" }
fluxheim-load-balancer = { path = "../fluxheim-load-balancer", optional = true }
fluxheim-observability = { path = "../fluxheim-observability", optional = true }
fluxheim-php-fpm = { path = "../fluxheim-php-fpm", optional = true }
fluxheim-protocol = { path = "../fluxheim-protocol" }
fluxheim-runtime = { path = "../fluxheim-runtime" }
fluxheim-tls = { path = "../fluxheim-tls", optional = true }
fluxheim-web = { path = "../fluxheim-web" }
getrandom = "0.4.3"
# "unstable" is required for Builder::initial_stream_id(3): RFC 7540 h2c
# upgrade assigns stream 1 to the HTTP/1.1 upgrade request, so new H2 streams
# must start at 3. Revisit when h2 stabilizes initial_stream_id.
h2 = { version = "0.4.15", features = ["unstable"] }
http = "1.4.2"
httpdate = "1.0.3"
log = "0.4.33"
base64-ng = "1.2.3"
openssl = { version = "0.10.81", optional = true }
percent-encoding = "2.3.2"
regex = "1.12.4"
ring = "0.17.14"
rustls = { version = "0.23.41", optional = true }
rustls-native-certs = { version = "0.8.4", optional = true }
sanitization = { version = "1.2.2", features = ["alloc"] }
serde_json = { version = "1.0.150", optional = true }
sha2 = "0.11.0"
socket2 = { version = "0.6.3", features = ["all"] }
tokio = { version = "1.52.3", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-openssl = { version = "0.6.5", optional = true }
tokio-rustls = { version = "0.26.4", optional = true }
ureq = { version = "3.3.0", default-features = false, features = ["rustls"], optional = true }
zeroize = "1.8.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "net", "process"] }

[dev-dependencies]
flate2 = "1.1.5"
rcgen = { version = "0.14.8", default-features = false, features = ["pem", "ring"] }
tempfile = "3.27.0"
