[package]
name = "fluxheim-server"
version = "1.6.7"
edition = "2024"
rust-version = "1.96"
license = "EUPL-1.2"
publish = false
description = "Internal Fluxheim listener and server boundary types."

[dependencies]
fluxheim-config = { path = "../fluxheim-config" }
fluxheim-protocol = { path = "../fluxheim-protocol" }
fluxheim-runtime = { path = "../fluxheim-runtime" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "net", "process"] }
