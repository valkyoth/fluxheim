[server]
listen = ["127.0.0.1:8080"]
default_vhost = "app"

[wasm]
enabled = true
plugin_roots = ["/srv/fluxheim/plugins"]
max_total_concurrent_executions = 32

[wasm.default_limits]
max_module_bytes = "1MiB"
max_memory_bytes = "16MiB"
max_table_elements = 10000
fuel = 5000000
timeout_ms = 50
compile_timeout_ms = 500

[wasm.default_admission]
max_concurrent_executions = 16
queue_limit = 4

[[wasm.plugins]]
name = "security_headers"
path = "/srv/fluxheim/plugins/security_headers.wasm"
sha256 = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
abi = "fluxheim-policy-v1"
host_call_namespace = "fluxheim-policy-v1"
phases = ["request-headers", "response-headers"]
fail_mode = "fail-closed"

[[wasm.attachments]]
plugin = "security_headers"
vhost = "app"
priority = 100
phases = ["response-headers"]

[[vhosts]]
name = "app"
hosts = ["app.test"]
