[package]
name = "fluxheim-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
fluxheim = { path = "..", features = ["php-fpm"] }
libfuzzer-sys = "0.4"

[patch.crates-io]
pingora-core = { path = "../vendor/pingora-core" }

[[bin]]
name = "host_normalization"
path = "fuzz_targets/host_normalization.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cache_headers"
path = "fuzz_targets/cache_headers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_php_response"
path = "fuzz_targets/parse_php_response.rs"
test = false
doc = false
bench = false
