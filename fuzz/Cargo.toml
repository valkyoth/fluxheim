[package]
name = "fluxheim-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
fluxheim-cache = { path = "../crates/fluxheim-cache" }
fluxheim-config = { path = "../crates/fluxheim-config" }
fluxheim-headers = { path = "../crates/fluxheim-headers" }
fluxheim-php-fpm = { path = "../crates/fluxheim-php-fpm" }
fluxheim-protocol = { path = "../crates/fluxheim-protocol" }
libfuzzer-sys = "0.4"

[[bin]]
name = "host_normalization"
path = "fuzz_targets/host_normalization.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cache_headers"
path = "fuzz_targets/cache_headers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_php_response"
path = "fuzz_targets/parse_php_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "header_policy"
path = "fuzz_targets/header_policy.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol_request_head"
path = "fuzz_targets/protocol_request_head.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol_response_head"
path = "fuzz_targets/protocol_response_head.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol_request_target"
path = "fuzz_targets/protocol_request_target.rs"
test = false
doc = false
bench = false

[[bin]]
