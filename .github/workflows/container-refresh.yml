name: Refresh Released Containers

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: released-container-refresh
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'valkyoth/fluxheim' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      matrix: ${{ steps.release.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m pip install PyYAML==6.0.3
      - id: release
        name: Resolve published stable release, never main application code
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/container_refresh.py resolve

  build:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.commit }}
          path: source
          persist-credentials: false
      - name: Install refresh tooling
        run: |
          python3 -m pip install PyYAML==6.0.3
          sudo apt-get update
          sudo apt-get install -y skopeo
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: prepare
        name: Resolve fresh vendor base and runtime packages
        env:
          VERSION: ${{ needs.release.outputs.version }}
          PROFILE: ${{ matrix.profile }}
          VARIANT: ${{ matrix.variant }}
        run: python3 scripts/container_refresh.py prepare --version "$VERSION" --profile "$PROFILE" --variant "$VARIANT"
      - id: tags
        env:
          VERSION: ${{ needs.release.outputs.version }}
          PROFILE: ${{ matrix.profile }}
          VARIANT: ${{ matrix.variant }}
        run: python3 scripts/container_refresh.py tags --version "$VERSION" --profile "$PROFILE" --variant "$VARIANT"
      - name: Build locally before publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: source
          file: source/containers/Containerfile.refresh
          platforms: linux/amd64
          load: true
          push: false
          tags: fluxheim-refresh:test
          pull: true
          no-cache-filters: runtime
          build-args: |
            RUNTIME_IMAGE=${{ steps.prepare.outputs.base }}
            FLUXHEIM_FEATURES=${{ steps.prepare.outputs.features }}
            FLUXHEIM_CONFIG=${{ steps.prepare.outputs.config }}
            FLUXHEIM_RUNTIME_PACKAGES=${{ steps.prepare.outputs.packages }}
          labels: |
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.revision=${{ needs.release.outputs.commit }}
            org.opencontainers.image.base.name=${{ steps.prepare.outputs.base }}
            io.fluxheim.runtime-refresh=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=refresh-${{ matrix.profile }}-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=refresh-${{ matrix.profile }}-${{ matrix.variant }}
      - name: Live HTTP and PHP runtime smoke
        env:
          VERSION: ${{ needs.release.outputs.version }}
          PROFILE: ${{ matrix.profile }}
          VARIANT: ${{ matrix.variant }}
        run: python3 scripts/smoke_container_refresh.py --engine docker --image fluxheim-refresh:test --source source --version "$VERSION" --profile "$PROFILE" --variant "$VARIANT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish tested candidate only
        env:
          CANDIDATE: ${{ steps.tags.outputs.candidate }}
        run: |
          docker tag fluxheim-refresh:test "ghcr.io/${GITHUB_REPOSITORY}:${CANDIDATE}"
          docker push "ghcr.io/${GITHUB_REPOSITORY}:${CANDIDATE}"

  promote:
    # No stable alias moves unless the entire image matrix passed.
    needs: [release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release.outputs.matrix) }}
    env:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      QUAY_NAMESPACE: ${{ vars.QUAY_NAMESPACE || github.repository_owner }}
      QUAY_REPOSITORY: ${{ vars.QUAY_REPOSITORY || github.event.repository.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          python3 -m pip install PyYAML==6.0.3
          sudo apt-get update
          sudo apt-get install -y skopeo
      - id: tags
        env:
          VERSION: ${{ needs.release.outputs.version }}
          PROFILE: ${{ matrix.profile }}
          VARIANT: ${{ matrix.variant }}
        run: python3 scripts/container_refresh.py tags --version "$VERSION" --profile "$PROFILE" --variant "$VARIANT"
      - name: Promote tested candidate to stable aliases and registry mirrors
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.tags.outputs.candidate }}
          ALIASES: ${{ steps.tags.outputs.aliases }}
        run: bash scripts/promote_container_refresh.sh
