name: Rust CI

on:
  push:
    branches:
      - main
      - '1.8.x'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - '1.8.x'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  acme-operation-scope:
    name: Packaged ACME renewal and server feature parity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test operation scopes without workspace feature unification
        run: |
          cargo test --locked -p fluxheim-config --features acme acme_scope
          cargo test --locked -p fluxheim-config --no-default-features acme_scope
          cargo test --locked --no-default-features --features profile-web-server,php-fpm,acme-client --lib cli::
          cargo test --locked --no-default-features --features proxy,tls-rustls,acme-client --lib cli::
          python3 scripts/test_acme_scope_smoke.py
      - name: Build Wolfi images and renew through both entry points
        env:
          FLUXHEIM_CONTAINER_RUNTIME: docker
        run: sh scripts/check_acme_scope.sh

  collectors:
    name: Required real collector workflows
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate collector fixtures and dashboards
        run: |
          python3 scripts/test_collectors.py
          python3 scripts/test_collector_guide.py
          python3 scripts/test_admin_examples.py
          python3 scripts/test_snapshot_examples.py
          python3 scripts/test_cli_examples.py
          python3 scripts/test_privacy_examples.py
          node --test tools/collector-browser/input.test.cjs
          python3 scripts/generate_observability_dashboards.py --check
      - name: Install pinned browser driver
        run: |
          npm ci --ignore-scripts --prefix tools/collector-browser
          tools/collector-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Build packaged server and require stored signals
        env:
          FLUXHEIM_CONTAINER_RUNTIME: docker
        run: sh scripts/check_collectors.sh release-reports/collectors
      - name: Upload sanitized success evidence
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: collector-proof
          path: |
            release-reports/collectors/summary.json
            release-reports/collectors/grafana.png
            release-reports/collectors/signoz.png
            release-reports/collectors/jaeger-trace.png
            release-reports/collectors/signoz-trace.png
          retention-days: 14

  container-refresh-policy:
    name: Container refresh policy regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 scripts/test_container_refresh.py
      - run: python3 scripts/test_core_dump_policy.py
      - run: python3 scripts/test_development_scope.py
      - run: python3 scripts/test_documentation_layout.py
      - run: python3 scripts/test_configuration_examples.py
      - run: python3 scripts/test_service_lifecycle.py
      - run: python3 scripts/test_installation_profiles.py
      - run: python3 scripts/test_logging_examples.py
      - run: python3 scripts/test_metrics_examples.py
      - run: python3 scripts/test_tracing_examples.py
      - run: python3 scripts/test_cache_examples.py
      - run: python3 scripts/test_routing_examples.py
      - run: python3 scripts/test_load_balancer_retry_examples.py
      - run: python3 scripts/test_proxy_hooks.py
      - run: python3 scripts/test_proxy_transport.py
      - run: python3 scripts/test_protocol_examples.py
      - run: python3 scripts/test_static_examples.py
      - run: python3 scripts/test_compression_examples.py
      - run: python3 scripts/test_cors_examples.py
      - run: python3 scripts/test_response_headers_examples.py
      - run: python3 scripts/test_request_headers_examples.py
      - run: python3 scripts/test_access_examples.py
      - run: python3 scripts/test_admission_examples.py
      - run: python3 scripts/test_stream_examples.py
      - run: python3 scripts/test_udp_examples.py
      - run: python3 scripts/test_php_examples.py
      - run: python3 scripts/test_php_transport.py
      - run: python3 scripts/test_observability_baseline.py
      - run: python3 scripts/test_log_rotation_fixture.py
      - run: python3 scripts/test_native_archives.py
      - run: bash -n scripts/promote_container_refresh.sh

  checks:
    name: Format, lint, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup show

      - name: Install security tools
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-audit --version 0.22.2

      - name: Install SBOM tool
        run: cargo install --locked cargo-sbom --version 0.10.0

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Validate release metadata
        run: |
          scripts/validate-release-metadata.sh
          python3 scripts/test_release_metadata.py

      - name: Check Markdown links
        run: perl scripts/check-doc-links.pl

      - name: Validate feature policy
        run: |
          scripts/validate-features.sh default
          scripts/validate-features.sh profile-core
          scripts/validate-features.sh profile-core,acme-client
          scripts/validate-features.sh profile-load-balancer
          scripts/validate-features.sh profile-full
          scripts/validate-features.sh profile-wasm
          scripts/validate-features.sh profile-development
          scripts/validate-features.sh profile-web-server
          scripts/validate-features.sh profile-cache-edge
          scripts/validate-features.sh profile-proxy-edge
          scripts/validate-features.sh profile-load-balancer-edge
          scripts/validate-features.sh profile-privacy
          scripts/validate-features.sh profile-fips-openssl
          scripts/validate-features.sh profile-iso19790-openssl
          scripts/validate-features.sh profile-fips-rustls
          scripts/validate-features.sh profile-iso19790-rustls
          if scripts/validate-features.sh profile-privacy,metrics; then
            echo "profile-privacy,metrics unexpectedly passed feature validation" >&2
            exit 1
          fi
          if scripts/validate-features.sh profile-core,tls-openssl; then
            echo "profile-core,tls-openssl unexpectedly passed feature validation" >&2
            exit 1
          fi
          if scripts/validate-features.sh tls-rustls,tls-openssl; then
            echo "tls-rustls,tls-openssl unexpectedly passed feature validation" >&2
            exit 1
          fi
          if scripts/validate-features.sh tls-rustls,tls-rustls-fips; then
            echo "tls-rustls,tls-rustls-fips unexpectedly passed feature validation" >&2
            exit 1
          fi

      - name: Validate Wasm release profile
        run: scripts/validate_wasm_release_profile.py

      - name: Validate portable release plan
        run: |
          scripts/validate_portable_release_plan.py
          scripts/validate_release_helpers.sh

      - name: Test local Windows VM launcher policy
        run: |
          python3 scripts/test_windows_qemu.py
          python3 scripts/test_windows_qemu_state.py

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Validate instant-acme patch provenance
        run: scripts/validate-instant-acme-patch.sh

      - name: Validate ACME mount-boundary test plan
        run: scripts/validate-acme-mount-boundary-plan.sh

      - name: Validate FIPS backend image evidence plan
        run: scripts/validate-fips-image-evidence-plan.sh
      - name: Validate FIPS guide configuration matrix
        run: |
          cargo test --locked -p fluxheim-config --lib fips_guide
          cargo test --locked -p fluxheim-config --lib --features tls-openssl-fips,metrics-otlp,otel-otlp,otel-tracing fips_guide
          cargo test --locked -p fluxheim-config --lib --features tls-rustls-fips,metrics-otlp,otel-otlp,otel-tracing fips_guide

      - name: Validate panic policy on feature profiles
        run: |
          cargo clippy --no-default-features --features proxy,tls-rustls,acme --all-targets -- -D warnings
          cargo clippy --no-default-features --features proxy,tls-rustls,acme-client --all-targets -- -D warnings
          cargo clippy --no-default-features --features tls-rustls --all-targets -- -D warnings
          cargo clippy --no-default-features --features profile-full --all-targets -- -D warnings
          cargo clippy --no-default-features --features profile-wasm --all-targets -- -D warnings
          cargo clippy --no-default-features --features profile-web-server --all-targets -- -D warnings
          cargo clippy --no-default-features --features profile-cache-edge --all-targets -- -D warnings
          cargo clippy --no-default-features --features profile-proxy-edge --all-targets -- -D warnings
          cargo clippy --no-default-features --features profile-web-server,php-fpm --all-targets -- -D warnings
          cargo clippy --no-default-features --features profile-load-balancer-edge --all-targets -- -D warnings
          cargo clippy --no-default-features --features proxy,web,tls-rustls,privacy-mode --all-targets -- -D warnings
          cargo clippy --no-default-features --features profile-fips-openssl --all-targets -- -D warnings
          cargo clippy --no-default-features --features profile-iso19790-openssl --all-targets -- -D warnings
          cargo clippy --no-default-features --features profile-fips-rustls --all-targets -- -D warnings
          cargo clippy --no-default-features --features profile-iso19790-rustls --all-targets -- -D warnings
          cargo clippy --no-default-features --features web --all-targets -- -D warnings

      - name: Validate native web TLS proof profiles
        run: scripts/validate-native-web-tls.sh check

      - name: Run default tests
        run: cargo test

      - name: Freeze observability baseline contracts
        run: |
          cargo test --locked -p fluxheim-common fatal::tests
          cargo test --locked -p fluxheim-observability --no-default-features
          cargo test --locked -p fluxheim-observability --no-default-features --features structured-events
          cargo test --locked -p fluxheim-observability --all-features
          cargo test --locked -p fluxheim-config --no-default-features observability
          cargo test --locked -p fluxheim-config --no-default-features --features metrics-otlp,otel-tracing,otel-otlp observability
          cargo test --locked -p fluxheim-config --no-default-features --features privacy-mode observability
          cargo test --locked -p fluxheim-config --no-default-features --features privacy-mode logging
          cargo test --locked -p fluxheim-config --no-default-features --features metrics-otlp metrics_guide
          cargo test --locked -p fluxheim-config --no-default-features --features privacy-mode metrics_guide
          cargo test --locked -p fluxheim-config --no-default-features tracing_guide
          cargo test --locked -p fluxheim-config --no-default-features --features otel-tracing tracing_guide
          cargo test --locked -p fluxheim-config --no-default-features --features otel-tracing,otel-otlp tracing_guide
          cargo test --locked -p fluxheim-config --no-default-features --features privacy-mode tracing_guide
          cargo test --locked -p fluxheim --lib --no-default-features --features profile-observability
          cargo test --locked -p fluxheim --lib --no-default-features --features profile-privacy structured_event_
          cargo test --locked -p fluxheim --lib --no-default-features --features profile-privacy admin::tests::events
          cargo test --locked -p fluxheim --lib --no-default-features --features profile-privacy admin::tests::audit_admission
          cargo test --locked -p fluxheim-server --lib --features wasm,php-fpm,tls-rustls,load-balancer
          cargo build --locked --no-default-features --features profile-observability --bin fluxheim
          python3 scripts/smoke_operational_events.py --binary target/debug/fluxheim
          python3 scripts/smoke_logging_examples.py --binary target/debug/fluxheim
          python3 scripts/smoke_metrics_examples.py --binary target/debug/fluxheim
          python3 scripts/smoke_tracing_examples.py --binary target/debug/fluxheim
          python3 scripts/smoke_collector_guide.py --binary target/debug/fluxheim
          python3 scripts/smoke_admin_examples.py --binary target/debug/fluxheim
          python3 scripts/smoke_snapshot_examples.py --binary target/debug/fluxheim
          cargo build --locked --no-default-features --features profile-development --bin fluxheim-config-tester
          python3 scripts/smoke_cli_examples.py --binary target/debug/fluxheim --tester target/debug/fluxheim-config-tester
          python3 scripts/smoke_log_file_rotation.py --binary target/debug/fluxheim
          python3 scripts/smoke_operational_backpressure.py --binary target/debug/fluxheim
          cargo build --locked --no-default-features --features profile-observability,stream-proxy,udp-proxy --bin fluxheim
          python3 scripts/smoke_fatal_listener_failures.py --binary target/debug/fluxheim

      - name: Verify Linux non-dumpable startup and fail-closed errors
        run: |
          sudo apt-get update
          sudo apt-get install -y strace
          cargo build --locked --no-default-features --features profile-observability --bins
          python3 scripts/smoke_linux_dump_policy.py --bin-dir target/debug

      - name: Test Linux live request and trace correlation
        run: |
          python3 -m venv target/correlation-venv
          target/correlation-venv/bin/python -m pip install -r scripts/request_correlation_requirements.txt
          target/correlation-venv/bin/python scripts/test_request_correlation_command.py
          cargo test --locked -p fluxheim-server --features otel-otlp,php-fpm native_request_telemetry
          cargo build --locked --no-default-features --features profile-observability,php-fpm --bin fluxheim
          target/correlation-venv/bin/python scripts/smoke_request_correlation.py --binary target/debug/fluxheim
          cargo test --locked -p fluxheim-observability --all-features otlp_
          cargo test --locked -p fluxheim-config --features metrics-otlp,otel-otlp,otel-tracing otlp_
          target/correlation-venv/bin/python scripts/smoke_otlp_lifecycle.py --binary target/debug/fluxheim

      - name: Test Linux operational API contract
        run: |
          target/correlation-venv/bin/python -m pip install --require-hashes --only-binary=:all: --force-reinstall -r scripts/operational_status_requirements.txt
          target/correlation-venv/bin/python scripts/test_operational_status_contract.py
          cargo test --locked --lib --no-default-features --features profile-observability,php-fpm admin::
          target/correlation-venv/bin/python scripts/smoke_operational_status.py --binary target/debug/fluxheim
          cargo test --locked --lib --no-default-features --features proxy,web operational_
          cargo build --locked --no-default-features --features proxy,web --bin fluxheim
          target/correlation-venv/bin/python scripts/smoke_operational_status.py --binary target/debug/fluxheim --reduced

      - name: Test standalone systemd boundary without workspace feature unification
        run: |
          cargo test --locked -p fluxheim-systemd --all-targets
          cargo build --locked -p fluxheim-systemd --example activation_ownership_probe

      - name: Run isolated ACME mount-boundary regression
        run: FLUXHEIM_ACME_MOUNT_TEST_MODE=container FLUXHEIM_ACME_MOUNT_TEST_RUNTIME=docker scripts/smoke_acme_mount_boundary.sh

      - name: Validate OWASP Top 10 2025 baseline
        run: scripts/validate-owasp-top10-2025.sh check

      - name: Validate 1.0 core feature matrix
        run: scripts/validate-1-0-core.sh check

      - name: Validate 1.0 gateway fixtures
        run: scripts/validate-1-0-fixtures.sh

      - name: Build 1.0 core release matrix
        run: scripts/validate-1-0-core.sh release

      - name: Run incubator feature build tests
        run: |
          scripts/validate-features.sh tls-rustls
          # These incubator profile permutations are build coverage. Use
          # `cargo check --tests` so test cfgs compile without linking many
          # large test binaries under CodeQL's instrumented environment.
          cargo check --tests --no-default-features --features proxy,load-balancer
          cargo check --tests --no-default-features --features proxy,cache
          cargo check --tests --no-default-features --features cache
          cargo check --tests --no-default-features --features web
          cargo check --tests --no-default-features --features wasm-wasi,wasm-proxy-abi
          cargo check --tests --no-default-features --features profile-core
          cargo check --no-default-features --features profile-core,acme-client
          cargo check --no-default-features --features profile-static-site
          cargo check --no-default-features --features profile-reverse-proxy
          cargo check --no-default-features --features profile-cache-server
          cargo check --no-default-features --features profile-load-balancer
          cargo check --no-default-features --features profile-full
          cargo check --no-default-features --features profile-wasm
          cargo check --no-default-features --features profile-development
          cargo check --no-default-features --features profile-web-server
          cargo check --no-default-features --features profile-cache-edge
          cargo check --no-default-features --features profile-proxy-edge
          cargo check --no-default-features --features profile-web-server,php-fpm
          cargo check --no-default-features --features profile-load-balancer-edge
          cargo check --no-default-features --features profile-observability
          cargo check --no-default-features --features profile-privacy
          cargo check --no-default-features --features profile-fips-openssl
          cargo check --no-default-features --features profile-iso19790-openssl
          cargo check --no-default-features --features profile-fips-rustls
          cargo check --no-default-features --features profile-iso19790-rustls
          cargo check --no-default-features --features tls-rustls
          cargo check --tests --no-default-features --features proxy,metrics
          cargo check --tests --no-default-features --features proxy,tls-rustls,acme
          cargo check --tests --no-default-features --features proxy,tls-rustls,acme-client
          cargo check --tests --no-default-features --features proxy,web,tls-rustls,privacy-mode
          cargo check --no-default-features --features proxy,tls-rustls

      - name: Clean build artifacts before config validation
        run: cargo clean

      - name: Validate example configs
        run: |
          cargo run --quiet -- --check-config --config examples/fluxheim.toml
          cargo run --quiet -- --check-config --config examples/admin.toml
          cargo run --quiet -- --check-config --config examples/vhosts.toml
          cargo run --quiet -- --check-config --config examples/acme-http-01.toml
          cargo run --quiet -- --check-config --config examples/acme-actalis.toml
          cargo run --quiet -- --check-config --config examples/cache-storage-bin.toml
          cargo run --quiet -- --check-config --config examples/cache-encryption-local.toml
          cargo run --quiet -- --check-config --config examples/cache-encryption-openbao.toml
          cargo run --quiet -- --check-config --config examples/cache-peer-fill.toml
          cargo run --quiet --no-default-features --features profile-development --bin fluxheim-config-tester -- --config examples/load-balancer-enterprise.toml --profile load-balancer --no-runtime-paths
          cargo run --quiet --no-default-features --features profile-development --bin fluxheim-config-tester -- --config examples/load-balancer-exec-health.toml --profile load-balancer --no-runtime-paths
          cargo run --quiet --no-default-features --features profile-development --bin fluxheim-config-tester -- --config examples/load-balancer-mysql-health.toml --profile load-balancer --no-runtime-paths
          cargo run --quiet --no-default-features --features profile-development --bin fluxheim-config-tester -- --config examples/load-balancer-postgres-health.toml --profile load-balancer --no-runtime-paths
          cargo run --quiet --no-default-features --features profile-development --bin fluxheim-config-tester -- --config examples/load-balancer-redis-health.toml --profile load-balancer --no-runtime-paths
          cargo run --quiet --no-default-features --features profile-web-server,php-fpm,acme-client -- --check-config --config examples/php-fpm.toml
          cargo run --quiet -- --check-config --config examples/tls-modern.toml
          cargo run --quiet -- --check-config --config examples/tls-intermediate.toml
          cargo run --quiet -- --check-config --config examples/privacy.toml
          cargo run --quiet -- --check-config --config examples/macos-dev.toml
          cargo run --quiet -- --check-config --config examples/container/fluxheim.toml
          cargo run --quiet -- --check-config --config packaging/container/fluxheim.toml
          cargo run --quiet --no-default-features --features profile-full,acme-client,metrics,metrics-otlp,otel-tracing,otel-otlp -- --check-config --config packaging/container/fluxheim.toml
          cargo run --quiet --no-default-features --features profile-web-server,acme-client -- --check-config --config packaging/container/fluxheim.toml
          cargo run --quiet --no-default-features --features profile-cache-edge,acme-client -- --validate-config --config packaging/container/cache.toml
          cargo run --quiet --no-default-features --features profile-proxy-edge,acme-client -- --validate-config --config packaging/container/proxy.toml
          cargo run --quiet --no-default-features --features profile-web-server,php-fpm,acme-client -- --check-config --config packaging/container/php.toml
          cargo run --quiet --no-default-features --features profile-development --bin fluxheim-config-tester -- --config packaging/container/load-balancer.toml --profile load-balancer --no-runtime-paths
          cargo run --quiet -- --check-config --config examples/conf.d
          cargo run --quiet -- --check-config --config examples/gateway-1-0
          cargo run --quiet --no-default-features --features profile-privacy -- --check-config --config examples/privacy.toml
          cargo run --quiet --no-default-features --features profile-fips-openssl --bin fluxheim-config-tester -- --config examples/fips-openssl.toml --profile fips-openssl --no-runtime-paths --crypto
          cargo run --quiet --no-default-features --features profile-iso19790-openssl --bin fluxheim-config-tester -- --config examples/iso19790-openssl.toml --profile iso19790-openssl --no-runtime-paths --crypto
          cargo run --quiet --no-default-features --features profile-fips-rustls --bin fluxheim-config-tester -- --config examples/fips-rustls.toml --profile fips-rustls --no-runtime-paths --crypto
          cargo run --quiet --no-default-features --features profile-iso19790-rustls --bin fluxheim-config-tester -- --config examples/iso19790-rustls.toml --profile iso19790-rustls --no-runtime-paths --crypto

      - name: Test privacy guide with real HTTP and verified TLS
        run: |
          cargo build --locked --no-default-features --features profile-privacy --bin fluxheim
          python3 scripts/smoke_privacy_examples.py --binary target/debug/fluxheim --tls

      - name: Validate OpenSSL FIPS-capable profile
        run: scripts/validate-fips-openssl.sh check

      - name: Validate rustls/AWS-LC FIPS-capable profile
        run: scripts/validate-fips-rustls.sh check

      - name: Run localhost smoke tests
        run: |
          FLUXHEIM_SMOKE_SKIP_CORE_MATRIX=1 sh scripts/smoke_1_0_core.sh
          sh scripts/smoke_admin_listener.sh
          sh scripts/smoke_snapshot_lifecycle.sh
          sh scripts/smoke_static_local.sh
          sh scripts/smoke_stream_proxy.sh
          sh scripts/smoke_load_balancer.sh
          sh scripts/smoke_proxy_cache.sh
          sh scripts/smoke_storage_bin_cache.sh
          sh scripts/smoke_cache_encryption_local.sh
          sh scripts/smoke_peer_fill_cache.sh
          sh scripts/smoke_observability_local.sh

      - name: Check dependency policy
        run: cargo deny check

      - name: Check RustSec advisories
        run: cargo audit

      - name: Generate SBOM
        run: scripts/generate-sbom.sh

      - name: Verify reproducible release build
        run: scripts/reproducible_build_check.sh

  linux-native-archives:
    name: Linux x86_64 extracted release profiles
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and exercise every extracted profile
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | sed -n '1p')"
          export FLUXHEIM_BUILD_ID="qualification-g$(git rev-parse --short=8 HEAD)"
          sh scripts/build_release_assets.sh "$version" --kind linux
          python3 scripts/test_native_archives.py
          python3 scripts/smoke_native_archives.py --version "$version" \
            --commit "$(git rev-parse HEAD)" --target x86_64-unknown-linux-gnu \
            --report native-archives.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-archives-linux-x86_64
          path: native-archives.json
          if-no-files-found: error
          retention-days: 14

  macos-portable:
    name: macOS Apple Silicon portable gate
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup show

      - name: Verify native macOS target
        run: |
          target="$(rustc -vV | sed -n 's/^host: //p')"
          test "${target}" = "aarch64-apple-darwin"

      - name: Check macOS portable profiles
        run: |
          scripts/validate_portable_release_plan.py
          cargo check --locked --no-default-features --features web --lib
          cargo check --locked --no-default-features --features profile-static-site --bin fluxheim
          cargo check --locked --no-default-features --features profile-reverse-proxy --bin fluxheim
          cargo check --locked --no-default-features --features profile-full --bin fluxheim
          cargo check --locked --no-default-features --features profile-wasm --bin fluxheim
          cargo check --locked --no-default-features --features profile-development --bin fluxheim --bin fluxheim-acme --bin fluxheim-config-tester

      - name: Run macOS native parity smoke
        run: sh scripts/smoke_macos_native_parity.sh

      - name: Test macOS filesystem trust fixtures
        run: |
          cargo test --locked -p fluxheim-config fs_trust::tests
          cargo test --locked -p fluxheim-cache storage_bin_manifest_rejects_special_file_without_blocking

      - name: Test macOS bounded logging and real pipe backpressure
        run: |
          cargo test --locked -p fluxheim-common fatal::tests
          cargo test --locked -p fluxheim --lib --no-default-features --features profile-observability runtime::runtime_logging
          cargo build --locked --no-default-features --features profile-observability --bin fluxheim
          python3 scripts/smoke_operational_events.py --binary target/debug/fluxheim
          python3 scripts/smoke_logging_examples.py --binary target/debug/fluxheim
          python3 scripts/smoke_metrics_examples.py --binary target/debug/fluxheim
          python3 scripts/smoke_tracing_examples.py --binary target/debug/fluxheim
          python3 scripts/smoke_collector_guide.py --binary target/debug/fluxheim
          python3 scripts/smoke_admin_examples.py --binary target/debug/fluxheim
          python3 scripts/smoke_snapshot_examples.py --binary target/debug/fluxheim
          cargo build --locked --no-default-features --features profile-development --bin fluxheim-config-tester
          python3 scripts/smoke_cli_examples.py --binary target/debug/fluxheim --tester target/debug/fluxheim-config-tester
          python3 scripts/smoke_log_file_rotation.py --binary target/debug/fluxheim
          python3 scripts/smoke_operational_backpressure.py --binary target/debug/fluxheim
          cargo build --locked --no-default-features --features profile-observability,stream-proxy,udp-proxy --bin fluxheim
          python3 scripts/smoke_fatal_listener_failures.py --binary target/debug/fluxheim

      - name: Test macOS privacy guide
        run: |
          cargo build --locked --no-default-features --features profile-privacy --bin fluxheim
          python3 scripts/smoke_privacy_examples.py --binary target/debug/fluxheim

      - name: Test macOS load-balancer retry and latency policy
        run: |
          cargo test --locked -p fluxheim-server --lib --features wasm,php-fpm,load-balancer,tls-rustls
          cargo build --locked --no-default-features --features profile-load-balancer-edge,acme-client --bin fluxheim
          mkdir -p "$HOME/.fluxheim-lb-smoke"
          chmod 700 "$HOME/.fluxheim-lb-smoke"
          python3 scripts/smoke_load_balancer_examples.py "$HOME/.fluxheim-lb-smoke"

      - name: Test macOS live request and trace correlation
        run: |
          python3 -m venv target/correlation-venv
          target/correlation-venv/bin/python -m pip install -r scripts/request_correlation_requirements.txt
          target/correlation-venv/bin/python scripts/test_request_correlation_command.py
          cargo test --locked -p fluxheim-server --features otel-otlp,php-fpm native_request_telemetry
          cargo build --locked --no-default-features --features profile-observability,php-fpm --bin fluxheim
          target/correlation-venv/bin/python scripts/smoke_request_correlation.py --binary target/debug/fluxheim
          cargo test --locked -p fluxheim-observability --all-features otlp_
          cargo test --locked -p fluxheim-config --features metrics-otlp,otel-otlp,otel-tracing otlp_
          target/correlation-venv/bin/python scripts/smoke_otlp_lifecycle.py --binary target/debug/fluxheim

      - name: Test macOS operational API contract
        run: |
          target/correlation-venv/bin/python -m pip install --require-hashes --only-binary=:all: --force-reinstall -r scripts/operational_status_requirements.txt
          target/correlation-venv/bin/python scripts/test_operational_status_contract.py
          cargo test --locked --lib --no-default-features --features profile-observability,php-fpm admin::
          target/correlation-venv/bin/python scripts/smoke_operational_status.py --binary target/debug/fluxheim
          cargo test --locked --lib --no-default-features --features proxy,web operational_

      - name: Build all macOS portable archives
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | sed -n '1p')"
          export FLUXHEIM_BUILD_ID="qualification-g$(git rev-parse --short=8 HEAD)"
          scripts/build_release_assets.sh "${version}" --kind macos
          target/correlation-venv/bin/python scripts/test_native_archives.py
          target/correlation-venv/bin/python scripts/smoke_native_archives.py --version "$version" \
            --commit "$(git rev-parse HEAD)" --target aarch64-apple-darwin \
            --report native-archives.json
          FLUXHEIM_BIN="$(pwd)/dist/fluxheim-${version}-wasm-aarch64-macos/fluxheim" \
            scripts/smoke_wasm_policy_examples_binary.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-archives-macos-aarch64
          path: native-archives.json
          if-no-files-found: error
          retention-days: 14

  windows-x86_64-portable:
    name: Windows x86_64 portable compile gate
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      RUSTFLAGS: -Dwarnings
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup show

      - name: Validate Windows portable plan and trust boundary
        run: |
          scripts/validate_portable_release_plan.py
          pwsh -NoProfile -File scripts/validate_windows_release_scripts.ps1
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | sed -n '1p')"
          pwsh -NoProfile -File scripts/build_release_assets.ps1 -Version "${version}" -Architecture x86_64 -Plan
          cargo test --locked -p fluxheim-config --no-default-features fs_trust::windows::tests

      - name: Run Windows workspace tests
        run: cargo test --workspace --locked

      - name: Compile Windows portable profiles
        run: |
          cargo check --locked --no-default-features --features profile-full,acme-client,metrics,metrics-otlp,otel-tracing,otel-otlp --bin fluxheim --bin fluxheim-acme
          cargo check --locked --no-default-features --features profile-wasm,acme-client,metrics,metrics-otlp,otel-tracing,otel-otlp --bin fluxheim --bin fluxheim-acme
          cargo check --locked --no-default-features --features profile-cache-edge,acme-client --bin fluxheim --bin fluxheim-acme
          cargo check --locked --no-default-features --features profile-proxy-edge,acme-client --bin fluxheim --bin fluxheim-acme
          cargo check --locked --no-default-features --features profile-load-balancer-edge,acme-client --bin fluxheim --bin fluxheim-acme
          cargo check --locked --no-default-features --features profile-web-server,php-fpm,acme-client --bin fluxheim --bin fluxheim-acme
          cargo check --locked --no-default-features --features profile-development --bin fluxheim --bin fluxheim-acme --bin fluxheim-config-tester

      - name: Run Windows native runtime parity smoke
        shell: pwsh
        run: scripts/smoke_windows_native.ps1

      - name: Test Windows protected log rotation
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python scripts/test_log_rotation_fixture.py
          python scripts/smoke_logging_examples.py --binary target/debug/fluxheim.exe
          python scripts/smoke_metrics_examples.py --binary target/debug/fluxheim.exe
          python scripts/smoke_tracing_examples.py --binary target/debug/fluxheim.exe
          python scripts/smoke_collector_guide.py --binary target/debug/fluxheim.exe
          python scripts/smoke_admin_examples.py --binary target/debug/fluxheim.exe
          python scripts/smoke_snapshot_examples.py --binary target/debug/fluxheim.exe
          cargo build --locked --no-default-features --features profile-development --bin fluxheim-config-tester
          python scripts/smoke_cli_examples.py --binary target/debug/fluxheim.exe --tester target/debug/fluxheim-config-tester.exe
          python scripts/smoke_log_file_rotation.py --binary target/debug/fluxheim.exe

      - name: Test Windows privacy guide
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --locked --no-default-features --features profile-privacy --bin fluxheim
          python scripts/smoke_privacy_examples.py --binary target/debug/fluxheim.exe

      - name: Test Windows load-balancer retry and latency policy
        run: |
          cargo test --locked -p fluxheim-server --lib --features wasm,php-fpm,load-balancer,tls-rustls
          if ($LASTEXITCODE -ne 0) { throw 'combined server tests failed' }
          cargo build --locked --no-default-features --features profile-load-balancer-edge,acme-client --bin fluxheim
          if ($LASTEXITCODE -ne 0) { throw 'load-balancer build failed' }
          python scripts/smoke_load_balancer_examples.py $env:TEMP
          if ($LASTEXITCODE -ne 0) { throw 'load-balancer smoke failed' }

      - name: Test Windows live request and trace correlation
        run: |
          python -m venv target/correlation-venv
          target/correlation-venv/Scripts/python.exe -m pip install -r scripts/request_correlation_requirements.txt
          target/correlation-venv/Scripts/python.exe scripts/test_request_correlation_command.py
          cargo test --locked -p fluxheim-server --features otel-otlp,php-fpm native_request_telemetry
          cargo build --locked --no-default-features --features profile-observability,php-fpm --bin fluxheim
          target/correlation-venv/Scripts/python.exe scripts/smoke_request_correlation.py --binary target/debug/fluxheim.exe
          cargo test --locked -p fluxheim-observability --all-features otlp_
          cargo test --locked -p fluxheim-config --features metrics-otlp,otel-otlp,otel-tracing otlp_
          target/correlation-venv/Scripts/python.exe scripts/smoke_otlp_lifecycle.py --binary target/debug/fluxheim.exe

      - name: Test Windows operational API contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          target/correlation-venv/Scripts/python.exe -m pip install --require-hashes --only-binary=:all: --force-reinstall -r scripts/operational_status_requirements.txt
          target/correlation-venv/Scripts/python.exe scripts/test_operational_status_contract.py
          cargo test --locked --lib --no-default-features --features profile-observability,php-fpm admin::
          target/correlation-venv/Scripts/python.exe scripts/smoke_operational_status.py --binary target/debug/fluxheim.exe
          cargo test --locked --lib --no-default-features --features proxy,web operational_
          cargo build --locked --no-default-features --features proxy,web --bin fluxheim
          target/correlation-venv/Scripts/python.exe scripts/smoke_operational_status.py --binary target/debug/fluxheim.exe --reduced

      - name: Build and test Windows portable archives
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $env:FLUXHEIM_BUILD_ID = "qualification-g$(git rev-parse --short=8 HEAD)"
          scripts/build_release_assets.ps1 -Version $version -Architecture x86_64
          scripts/smoke_windows_archive_profiles.ps1 -Version $version -Architecture x86_64
          python scripts/test_native_archives.py
          if ($LASTEXITCODE -ne 0) { throw 'native archive regression tests failed' }
          python scripts/smoke_native_archives.py --version $version --commit (git rev-parse HEAD) `
            --target x86_64-pc-windows-msvc --report native-archives.json
          if ($LASTEXITCODE -ne 0) { throw 'native archive qualification failed' }
          scripts/smoke_windows_wasm_archive.ps1 -Version $version -Architecture x86_64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-archives-windows-x86_64
          path: native-archives.json
          if-no-files-found: error
          retention-days: 14
