name: FIPS Backend Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-evidence:
    name: ${{ matrix.backend }} provider and live TLS
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        backend:
          - openssl
          - rustls

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build exact backend binary and run live TLS evidence
        run: scripts/smoke_fips_backend_images.sh "${{ matrix.backend }}"
