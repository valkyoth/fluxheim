name: FIPS Backend Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-evidence:
    name: ${{ matrix.backend }} provider and live TLS
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        backend:
          - openssl
          - rustls

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build exact backend binary and run live TLS evidence
        run: scripts/smoke_fips_backend_images.sh "${{ matrix.backend }}"
