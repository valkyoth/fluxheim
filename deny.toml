# Fluxheim dependency policy.
#
# Fluxheim is an EUPL-1.2 project. Third-party dependencies are checked with a
# narrow allow-list so incompatible or unclear licenses fail early.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.95
include-dev = true
include-build = true
unused-allowed-license = "allow"
unused-license-exception = "deny"

allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "EUPL-1.2",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]

exceptions = [
    # TLS root stores can carry reviewed data licenses. Keep exceptions narrow;
    # do not globally allow CDLA-Permissive-2.0 for code.
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    # The opt-in rustls/AWS-LC FIPS build path pulls the validated native
    # aws-lc-fips-sys module, whose upstream license expression includes
    # OpenSSL. Keep this exception scoped to that crate instead of globally
    # allowing OpenSSL-licensed dependencies.
    { allow = ["OpenSSL"], crate = "aws-lc-fips-sys" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"

[advisories]
db-path = "/tmp/fluxheim-cargo-deny-advisory-dbs"
yanked = "deny"
unmaintained = "workspace"
unsound = "workspace"
unused-ignored-advisory = "deny"
ignore = [
    { id = "RUSTSEC-2024-0437", reason = "Transitive through pingora-core -> prometheus 0.13.4 -> protobuf 2.28.0. Pingora's PrometheusHttpApp uses TextEncoder directly and ignores Accept negotiation, so Fluxheim does not expose protobuf parsing on /metrics; recheck when Pingora moves to prometheus >=0.14 or removes protobuf." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
