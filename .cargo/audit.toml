[advisories]
ignore = [
    # Transitive through pingora-core -> prometheus 0.13.4 -> protobuf 2.28.0.
    # Pingora's PrometheusHttpApp uses TextEncoder directly and ignores Accept
    # negotiation, so Fluxheim does not expose protobuf parsing on /metrics.
    # REVIEW: scripts/validate-release-metadata.sh fails if prometheus no longer
    # stays at 0.13.4 while this suppression exists. Remove this when Pingora
    # moves to prometheus >=0.14 or otherwise drops vulnerable protobuf 2.x.
    # Next scheduled manual review before 2026-08-01.
    "RUSTSEC-2024-0437",
]

[database]
path = "/tmp/fluxheim-cargo-audit-advisory-db"
url = "https://github.com/RustSec/advisory-db.git"
fetch = true
stale = false

[yanked]
enabled = false
update_index = false
