name: fluxheim-gateway-acme

networks:
  gateway_net:
    external: true

services:
  fluxheim:
    ulimits:
      core:
        soft: 0
        hard: 0
    image: "${FLUXHEIM_GATEWAY_IMAGE:?Set a tested gateway image}"
    command: ["--config", "/etc/fluxheim/fluxheim.toml"]
    container_name: fluxheim_gateway
    restart: always
    stop_signal: SIGTERM
    # Allow margin beyond the default 30-second drain; increase for custom grace.
    stop_grace_period: 45s
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - /srv/infra/fluxheim/config/fluxheim.toml:/etc/fluxheim/fluxheim.toml:ro,z
      - /srv/infra/fluxheim/config/conf.d:/etc/fluxheim/conf.d:ro,z
      - /srv/infra/fluxheim/run:/run/fluxheim:z
      - /srv/infra/fluxheim/state:/var/lib/fluxheim:z
      - /srv/infra/fluxheim/cache:/var/cache/fluxheim:Z
      - /srv/infra/fluxheim/logs:/var/log/fluxheim:Z
      - /srv/infra/fluxheim/html:/srv/fluxheim:ro,Z
      - /srv/sites/example/public:/srv/sites/example/public:ro,Z
      # Shared labeling, private service-user permissions; provision ownership once.
      - /srv/infra/fluxheim/secrets/actalis-eab-kid:/run/secrets/actalis-eab-kid:ro,z
      - /srv/infra/fluxheim/secrets/actalis-eab-hmac-key:/run/secrets/actalis-eab-hmac-key:ro,z
    networks:
      - gateway_net

  fluxheim-acme:
    ulimits:
      core:
        soft: 0
        hard: 0
    image: "${FLUXHEIM_RENEWAL_IMAGE:?Set a tested renewal image}"
    profiles: ["renewal"]
    container_name: fluxheim_acme
    restart: "no"
    entrypoint:
      - "/usr/local/bin/fluxheim-acme"
    depends_on:
      - fluxheim
    command:
      - "--config"
      - "/etc/fluxheim/fluxheim.toml"
      - "renew"
    volumes:
      - /srv/infra/fluxheim/config/fluxheim.toml:/etc/fluxheim/fluxheim.toml:ro,z
      - /srv/infra/fluxheim/config/conf.d:/etc/fluxheim/conf.d:ro,z
      - /srv/infra/fluxheim/run:/run/fluxheim:z
      - /srv/infra/fluxheim/state:/var/lib/fluxheim:z
      - /srv/infra/fluxheim/secrets/actalis-eab-kid:/run/secrets/actalis-eab-kid:ro,z
      - /srv/infra/fluxheim/secrets/actalis-eab-hmac-key:/run/secrets/actalis-eab-hmac-key:ro,z
    networks:
      - gateway_net
