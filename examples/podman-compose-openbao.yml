services:
  openbao:
    image: quay.io/openbao/openbao:2.5
    container_name: fluxheim_openbao_dev
    command: ["server", "-dev"]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: fluxheim-dev-token
      BAO_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bao status -address=http://127.0.0.1:8200 >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges
