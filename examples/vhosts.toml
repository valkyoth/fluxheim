[server]
listen = ["127.0.0.1:8080"]
# tls_listen = ["127.0.0.1:8443"]
default_vhost = "example.test"
# trusted_proxies = ["127.0.0.1", "10.0.0.0/8"]

# [server.https_redirect]
# enabled = true
# status = 308
# target_port = 8443

[server.limits]
max_request_header_bytes = "64KiB"
max_uri_bytes = "8KiB"
max_request_headers = 100
max_request_body_bytes = "16MiB"

[server.process]
daemon = false
# error_log = "/run/fluxheim/error.log"
pid_file = "/run/fluxheim/fluxheim.pid"
upgrade_sock = "/run/fluxheim/fluxheim-upgrade.sock"
threads = 1
listener_tasks_per_fd = 1
work_stealing = true
upstream_keepalive_pool_size = 128
max_retries = 16

[logging]
level = "info"
format = "json"
target = "stderr"

[logging.file]
enabled = false
# path = "/var/log/fluxheim/fluxheim.log"
append = true

[logging.access]
enabled = true
include_host = true
include_path = true
request_id = true
request_id_header = "x-request-id"

[tls]
enabled = false
backend = "rustls"

# [[tls.certificates]]
# cert_path = "tls/fullchain.pem"
# key_path = "tls/key.pem"

[tls.acme]
enabled = false
# storage = "/var/lib/fluxheim/acme"
# contact_email = "admin@example.test"
default_issuer = "letsencrypt"
challenge = "http-01"

[tls.acme.renewal]
enabled = true
renew_before_secs = 2592000
# renew_after = 2026-06-01T00:00:00Z
check_interval_secs = 3600
retry_initial_secs = 300
retry_max_secs = 86400
reload_after_renewal = true
zero_downtime_reload = true

[headers.request]
enabled = true
strip_inbound_client_ip_headers = true
x_forwarded_for = "replace"
x_real_ip = true
x_forwarded_host = true
x_forwarded_proto = true
forwarded = false
remove = ["x-powered-by"]

[headers.request.add]
x-proxy-by = "Fluxheim"
x-forwarded-host = "{host}"

[headers.request.append]
via = "fluxheim"

[headers.response]
enabled = true
# strict_transport_security = "max-age=31536000; includeSubDomains"
# content_security_policy = "default-src 'self'"
x_content_type_options = "nosniff"
x_frame_options = "DENY"
referrer_policy = "no-referrer"
remove = ["x-powered-by"]

[headers.response.add]
cache-control = "public, max-age=60"

[headers.response.append]
vary = ["Accept-Encoding"]

[[vhosts]]
name = "www.example.test"
hosts = ["www.example.test"]

[vhosts.redirect]
enabled = true
to = "https://example.test{uri}"
status = 308

# TOML note: [[vhosts]] starts one virtual host. Every [vhosts.*] table below
# belongs to this vhost until the next [[vhosts]] line.
[[vhosts]]
name = "example.test"
hosts = ["example.test"]
max_request_body_bytes = "64MiB"

[vhosts.tls]
enabled = false

# [vhosts.tls.acme]
# enabled = true

[vhosts.web]
root = "/srv/sites/example"
index_files = ["index.html"]
deny_dotfiles = true
cache_control = "public, max-age=300"

[vhosts.acme_challenge]
enabled = false
# upstreams = ["host.containers.internal:8080"]

[vhosts.proxy]
upstreams = ["127.0.0.1:3000", "127.0.0.1:3001"]
upstream_tls = false

[vhosts.headers.response.add]
access-control-allow-origin = "https://example.test"

[vhosts.headers.response.append]
vary = ["Origin"]

[[vhosts.routes]]
name = "chat"
path_prefix = "/chat/"
strip_prefix = "/chat/"
max_request_body_bytes = "64MiB"

[vhosts.routes.proxy]
upstreams = ["127.0.0.1:6012"]
upstream_tls = false
connect_timeout_secs = 5
read_timeout_secs = 600
send_timeout_secs = 600
downstream_write_timeout_secs = 30
downstream_min_send_rate_bytes_per_sec = 8192

[vhosts.routes.cache]
enabled = true
status_header = "X-Cache-Status"
methods = ["GET", "HEAD"]
max_object_bytes = "32MiB"

[vhosts.routes.cache.memory]
enabled = true
max_size_bytes = "256MiB"

[[vhosts.routes.proxy.error_pages]]
status = 502
path = "/502.html"

[vhosts.routes.proxy.error_pages.web]
root = "/srv/sites/errors"
cache_control = "private, no-store"

[[vhosts.routes]]
name = "repo"
path_prefix = "/repo"
strip_prefix = "/repo"

[vhosts.routes.web]
root = "/srv/sites/example-repo"
index_files = ["repo.html", "index.html"]
deny_dotfiles = true

[vhosts.routes.web.directory_listing]
enabled = true
exact_size = false

[[vhosts.routes]]
name = "fallback"
fallback = true
max_request_body_bytes = "16MiB"

[vhosts.routes.proxy]
upstreams = ["127.0.0.1:3000", "127.0.0.1:3001"]
upstream_tls = false
connect_timeout_secs = 5
read_timeout_secs = 60
send_timeout_secs = 60

[[vhosts.routes.proxy.error_pages]]
status = 502
path = "/502.html"

[vhosts.routes.proxy.error_pages.web]
root = "/srv/sites/errors"
cache_control = "private, no-store"

[vhosts.proxy.load_balance]
max_iterations = 256

[vhosts.proxy.load_balance.health_check]
enabled = true
interval_secs = 1
consecutive_success = 1
consecutive_failure = 1
parallel = false

[vhosts.cache]
enabled = true
status_header = "X-Cache-Status"
image_extensions = ["avif", "gif", "jpeg", "jpg", "png", "svg", "webp"]
methods = ["GET", "HEAD"]
max_object_bytes = "32MiB"

[vhosts.cache.memory]
enabled = true
max_size_bytes = "1GiB"

[vhosts.cache.disk]
enabled = false
# path = "/var/cache/fluxheim/example.test"
max_size_bytes = "10GiB"

# Start a second virtual host. The [vhosts.*] tables below now belong to
# api.example.test, not example.test.
[[vhosts]]
name = "api.example.test"
hosts = ["api.example.test", "*.api.example.test"]

[vhosts.proxy]
upstreams = ["127.0.0.1:4000", "127.0.0.1:4001"]
upstream_tls = false

[vhosts.proxy.load_balance.health_check]
enabled = true
