# Loopback demonstration only. Peers must serve the same public Host/content.
# Do not use custom-header variants or untrusted plaintext peer networks; see
# docs/guides/cache-peer-fill.md for the current integrity limitations.
[server]
listen = ["127.0.0.1:8080"]
default_vhost = "cache-peer.example.test"

[logging]
level = "info"
format = "json"
target = "stderr"

[[vhosts]]
name = "cache-peer.example.test"
hosts = ["cache-peer.example.test"]

[vhosts.cache]
enabled = true
status_header = "X-Cache-Status"
status_reason_header = "X-Cache-Reason"
allow_client_cache_refresh = false
key_namespace = "peer-fill-example-v1"
key_parts = ["method", "host", "path", "query"]
default_status_ttl_secs = 300
content_types = ["image/*", "text/css", "application/javascript", "font/*"]
image_extensions = ["avif", "css", "gif", "ico", "jpg", "js", "png", "svg", "webp", "woff2"]
max_object_bytes = "32MiB"

[vhosts.cache.memory]
enabled = true
max_size_bytes = "512MiB"

[vhosts.cache.disk]
enabled = true
backend = "storage-bin"
path = "cache/peer-fill"
max_size_bytes = "20GiB"

[vhosts.cache.disk.storage_bin]
bin_size_bytes = "256MiB"
preallocate = false
max_open_bins = 16

[vhosts.cache.lock]
enabled = true
age_timeout_secs = 30
wait_timeout_secs = 30

[vhosts.cache.peer_fill]
enabled = true
connect_timeout_secs = 2
read_timeout_secs = 10
max_object_bytes = "32MiB"
max_concurrent_requests = 64
allow_insecure_http = false
fail_open = true

[[vhosts.cache.peer_fill.peers]]
name = "cache-a"
base_url = "http://127.0.0.1:18081"

[[vhosts.cache.peer_fill.peers]]
name = "cache-b"
base_url = "http://[::1]:18082"

[vhosts.proxy]
upstreams = ["127.0.0.1:3000"]
upstream_tls = false
