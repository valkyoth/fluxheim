# Append these sections to local.toml only when a same-host Collector is running.
[metrics.otlp]
enabled = true
endpoint = "http://127.0.0.1:4318/v1/metrics"
service_name = "fluxheim"
interval_secs = 15
timeout_secs = 2

[tracing]
enabled = true
mode = "propagate_only"
traceparent = true
log_trace_id = true

[tracing.otlp]
enabled = true
endpoint = "http://127.0.0.1:4318/v1/traces"
service_name = "fluxheim"
queue_size = 8192
timeout_secs = 2
