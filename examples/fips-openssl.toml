# Minimal FIPS-capable OpenSSL validation example.
#
# Build a matching binary with:
#   cargo build --no-default-features --features profile-fips-openssl
#
# Validate the profile and provider availability with:
#   cargo run --no-default-features --features profile-fips-openssl \
#     --bin fluxheim-config-tester -- \
#     --config examples/fips-openssl.toml \
#     --profile fips-openssl \
#     --no-runtime-paths \
#     --crypto
#
# This file is an evidence/diagnostic fixture. Real deployments still need
# vhosts, certificates, a validated OpenSSL FIPS provider, and the module
# Security Policy evidence described in docs/fips.md.

[server]
listen = ["127.0.0.1:8080"]

[tls]
enabled = true
backend = "openssl"
profile = "intermediate"
min_protocol = "tls1.2"
curve_preferences = ["CurveP256", "CurveP384"]
cipher_suites = [
  "TLS_AES_256_GCM_SHA384",
  "TLS_AES_128_GCM_SHA256",
  "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384",
]

[tls.fips]
required = true
