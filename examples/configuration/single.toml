# Run from the repository root; paths are relative to this file, not the shell.
[server]
listen = ["127.0.0.1:8080"]
default_vhost = "guide"

[server.process]
threads = 1
pid_file = "fluxheim.pid"
upgrade_sock = "upgrade.sock"
certificate_reload_sock = "reload.sock"

[cache]
enabled = false

[[vhosts]]
name = "guide"
hosts = ["configuration.example.test"]

[vhosts.web]
root = "site"
