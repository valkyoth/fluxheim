# Beta request/response forwarding, not an authoritative DNS server.
[server]
listen = []
[server.process]
daemon = false
threads = 1
pid_file = "fluxheim.pid"
upgrade_sock = "upgrade.sock"
certificate_reload_sock = "reload.sock"
[cache]
enabled = false

[udp]
enabled = true
[[udp.routes]]
name = "local-datagrams"
mode = "dns-load-balance"
listen = ["127.0.0.1:15353"]
upstream = "127.0.0.1:19053"
idle_timeout_secs = 30
response_timeout_secs = 1
max_datagram_bytes = 1232
max_sessions = 32
max_sessions_per_source = 8
max_responses_per_source_per_second = 64
passive_health_enabled = true
passive_health_failures = 3
passive_health_ejection_secs = 10
