# This file contains one vhost. Splitting vhosts into separate files avoids
# confusion about which [vhosts.*] tables belong to which [[vhosts]] block.
[[vhosts]]
name = "api.example.test"
hosts = ["api.example.test", "*.api.example.test"]

[vhosts.proxy]
upstreams = ["127.0.0.1:4000", "127.0.0.1:4001"]
upstream_tls = false

[vhosts.proxy.load_balance.health_check]
enabled = true
