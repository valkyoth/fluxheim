[server]
listen = ["0.0.0.0:8080"]
tls_listen = ["0.0.0.0:8443"]
default_vhost = "science.chat"
trusted_proxies = ["10.0.0.0/8", "127.0.0.1"]

[server.process]
daemon = false
pid_file = "/run/fluxheim/fluxheim.pid"
upgrade_sock = "/run/fluxheim/fluxheim-upgrade.sock"
grace_period_seconds = 2
graceful_shutdown_timeout_seconds = 5

[server.limits]
max_request_header_bytes = "64KiB"
max_uri_bytes = "8KiB"
max_request_headers = 100
max_request_body_bytes = "16MiB"

[server.https_redirect]
enabled = true
status = 308
target_port = 443

[logging]
level = "info"
format = "json"
target = "stderr"

[logging.access]
enabled = true
include_host = true
include_path = true
request_id = true
request_id_header = "x-request-id"

[headers.request]
enabled = true
strip_inbound_client_ip_headers = true
x_forwarded_for = "replace"
x_real_ip = true
x_forwarded_host = true
x_forwarded_proto = true
forwarded = false
remove = ["x-powered-by"]

[headers.request.add]
host = "{host}"
x-forwarded-host = "{host}"
x-original-uri = "{uri}"
x-proxy-by = "Fluxheim"

[headers.response]
enabled = true
x_content_type_options = "nosniff"
x_frame_options = "DENY"
referrer_policy = "no-referrer"
remove = ["x-powered-by"]

[tls]
enabled = true
backend = "rustls"

[[tls.certificates]]
cert_path = "/etc/fluxheim/tls/science.chat/fullchain.pem"
key_path = "/etc/fluxheim/tls/science.chat/privkey.pem"

[[tls.certificates]]
cert_path = "/etc/fluxheim/tls/dev.pawalyze.com/fullchain.pem"
key_path = "/etc/fluxheim/tls/dev.pawalyze.com/privkey.pem"

[cache]
enabled = false
