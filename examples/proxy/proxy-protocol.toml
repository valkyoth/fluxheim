# Only the local test sender may connect. Origin must also understand PROXY v1.
[server]
listen = ["127.0.0.1:8080"]
proxy_protocol = "v1"
trusted_proxies = ["127.0.0.1"]
[server.host_routing]
strict = true
[server.process]
threads = 1
pid_file = "fluxheim.pid"
upgrade_sock = "upgrade.sock"
certificate_reload_sock = "reload.sock"
[cache]
enabled = false
[[vhosts]]
name = "app"
hosts = ["app.example.test"]
[vhosts.proxy]
upstreams = ["127.0.0.1:9001"]
upstream_http_version = "http1"
upstream_proxy_protocol = "v1"
connect_timeout_secs = 2
read_timeout_secs = 2
send_timeout_secs = 2
