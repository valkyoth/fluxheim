[server]
listen = ["127.0.0.1:8080"]
trusted_proxies = []

[server.limits]
max_request_header_bytes = "64KiB"
max_uri_bytes = "8KiB"
max_request_headers = 100
max_request_body_bytes = "16MiB"

[admin]
enabled = false
listen = "127.0.0.1:9090"
require_loopback = true

[metrics]
enabled = false
listen = "127.0.0.1:9091"
require_loopback = true

[logging]
level = "info"
format = "json"

[logging.access]
enabled = false
request_id = false
request_id_header = "x-request-id"

[headers.request]
enabled = true
strip_inbound_client_ip_headers = true
x_forwarded_for = "off"
x_forwarded_host = false
x_forwarded_proto = false
forwarded = false
unset = [
  "cf-connecting-ip",
  "fastly-client-ip",
  "true-client-ip",
  "x-forwarded-for",
  "x-real-ip",
]

[headers.response]
enabled = true
x_content_type_options = "nosniff"
x_frame_options = "DENY"
referrer_policy = "no-referrer"
unset = ["server", "x-powered-by"]

[proxy]
upstream = "127.0.0.1:3000"
upstream_tls = false

[proxy.load_balance]
max_iterations = 256

[proxy.load_balance.health_check]
enabled = false
interval_secs = 1
consecutive_success = 1
consecutive_failure = 1
parallel = false

[tls]
enabled = false
backend = "rustls"

[tls.acme]
enabled = false
default_issuer = "letsencrypt"
challenge = "tls-alpn-01"

[tls.acme.renewal]
enabled = true
renew_before_secs = 2592000
check_interval_secs = 3600
retry_initial_secs = 300
retry_max_secs = 86400
reload_after_renewal = true
zero_downtime_reload = true

[cache]
enabled = false
image_extensions = ["avif", "gif", "jpeg", "jpg", "png", "svg", "webp"]
methods = ["GET", "HEAD"]
max_object_bytes = "32MiB"

[cache.memory]
enabled = false
max_size_bytes = "1GiB"

[cache.disk]
enabled = false
max_size_bytes = "10GiB"

[web]
root = "/srv/fluxheim"
index_files = ["index.html"]
deny_dotfiles = true
