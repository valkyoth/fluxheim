# Minimal ISO/IEC 19790-capable rustls/AWS-LC validation example.
#
# Build a matching binary with:
#   cargo build --no-default-features --features profile-iso19790-rustls
#
# The rustls FIPS path builds aws-lc-fips-sys and therefore requires the
# toolchain documented by that crate, including CMake, Go, and a C compiler.
#
# Validate the profile and provider availability with:
#   cargo run --no-default-features --features profile-iso19790-rustls \
#     --bin fluxheim-config-tester -- \
#     --config examples/iso19790-rustls.toml \
#     --profile iso19790-rustls \
#     --no-runtime-paths \
#     --crypto
#
# This file is an evidence/diagnostic fixture. Real deployments still need
# vhosts, certificates, a validated AWS-LC FIPS/ISO module path, and the module
# Security Policy evidence described in docs/fips.md.

[server]
listen = ["127.0.0.1:8080"]

[tls]
enabled = true
backend = "rustls"
profile = "intermediate"
min_protocol = "tls1.2"
curve_preferences = ["CurveP256", "CurveP384"]
cipher_suites = [
  "TLS_AES_256_GCM_SHA384",
  "TLS_AES_128_GCM_SHA256",
  "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384",
]

[tls.iso19790]
required = true
