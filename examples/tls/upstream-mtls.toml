# The origin must trust the CA that issued gateway-client.pem.
[server]
listen = ["127.0.0.1:8080"]
default_vhost = "gateway"
trusted_proxies = []

[server.process]
daemon = false
threads = 1
pid_file = "fluxheim.pid"
upgrade_sock = "upgrade.sock"
certificate_reload_sock = "reload.sock"

[cache]
enabled = false

[[vhosts]]
name = "gateway"
hosts = ["gateway.example.test"]

[vhosts.proxy]
upstreams = ["127.0.0.1:9443"]
upstream_tls = true
upstream_sni = "origin.example.test"
upstream_verify_cert = true
upstream_verify_hostname = true
upstream_ca_path = "origin-ca.pem"
upstream_client_cert_path = "gateway-client.pem"
upstream_client_key_path = "gateway-client-key.pem"
upstream_http_version = "http1"
connect_timeout_secs = 3
upstream_total_connection_timeout_secs = 5
read_timeout_secs = 5
send_timeout_secs = 5
