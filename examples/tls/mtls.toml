# HTTPS only: a separate plaintext listener would not enforce TLS client auth.
[server]
listen = []
tls_listen = ["127.0.0.1:8443"]
default_vhost = "site"

[server.process]
pid_file = "fluxheim.pid"
upgrade_sock = "upgrade.sock"
certificate_reload_sock = "reload.sock"

[tls]
enabled = true
backend = "rustls"
profile = "intermediate"
alpn = "http1-and-http2"

[[tls.certificates]]
cert_path = "server.pem"
key_path = "server-key.pem"

[tls.client_auth]
mode = "required"
ca_path = "client-ca.pem"
# crl_path = "client-crls.pem"

[cache]
enabled = false

[[vhosts]]
name = "site"
hosts = ["site.example.test"]
[vhosts.tls]
enabled = true
[vhosts.tls.certificate]
cert_path = "server.pem"
key_path = "server-key.pem"
[vhosts.web]
root = "site"
index_files = ["index.html"]
