# Replace the WHOLE [proxy] block and children. Supply real service DNS names.
[proxy]
upstreams = ["app-a.internal.example:8080", "app-b.internal.example:8080"]
upstream_dns_refresh_secs = 5
upstream_dns_allow_private_backends = true

[proxy.load_balance]
selection = "round-robin"
all_down_status = 503
