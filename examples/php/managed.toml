# Unix only. Install PHP-FPM and create public/index.php before starting.
[server]
listen = ["127.0.0.1:8080"]
default_vhost = "php.example.test"

[server.process]
pid_file = "fluxheim.pid"
upgrade_sock = "upgrade.sock"
certificate_reload_sock = "reload.sock"
threads = 2

[server.limits]
max_request_body_bytes = "1MiB"

[[vhosts]]
name = "php.example.test"
hosts = ["php.example.test"]

[vhosts.php]
enabled = true
preset = "wordpress"
root = "public"
max_in_flight = 4
max_request_body_bytes = "1MiB"
request_timeout_secs = 10
hide_response_headers = ["x-powered-by"]

[vhosts.php.fpm]
mode = "managed"
php_fpm_binary = "/usr/sbin/php-fpm"
socket_dir = "/run/fluxheim/php"
workers = 4
process_manager = "dynamic"
start_servers = 2
min_spare_servers = 1
max_spare_servers = 4

[vhosts.web]
root = "public"
index_files = ["index.html"]
deny_dotfiles = true

[vhosts.web.directory_listing]
enabled = false
