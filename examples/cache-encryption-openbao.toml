[server]
listen = ["127.0.0.1:8080"]
default_vhost = "openbao-cache.example.test"

[logging]
level = "info"
format = "json"
target = "stderr"

[proxy]
upstreams = ["127.0.0.1:3000"]

[cache]
enabled = true
status_header = "X-Cache-Status"
content_types = ["image/*"]
extensions = ["avif", "gif", "jpg", "png", "svg", "webp"]
max_object_bytes = "16MiB"

[cache.memory]
enabled = false

[cache.disk]
enabled = true
backend = "storage-bin"
path = "cache/encrypted-openbao"
max_size_bytes = "10GiB"

[cache.disk.storage_bin]
bin_size_bytes = "128MiB"
preallocate = false
max_open_bins = 8

[cache.disk.encryption]
enabled = true
provider = "openbao-transit"
key_id = "openbao-cache-v1"

[cache.disk.encryption.openbao]
address = "https://openbao.internal.example"
mount = "transit"
key_name = "fluxheim-cache"
token_credential = "openbao-token"

[[vhosts]]
name = "openbao-cache.example.test"
hosts = ["openbao-cache.example.test"]

[vhosts.proxy]
upstreams = ["127.0.0.1:3000"]
upstream_tls = false
