[server]
listen = ["0.0.0.0:8080"]
tls_listen = ["0.0.0.0:8443"]
default_vhost = "php"

[tls]
enabled = true
backend = "rustls"

[tls.acme]
enabled = true
storage = "/var/lib/fluxheim/acme"
contact_email = "admin@example.test"
challenge = "http-01"

[[vhosts]]
name = "php"
hosts = ["localhost", "php.example.test"]

[vhosts.tls]
enabled = true

[vhosts.tls.acme]
enabled = true
domains = ["php.example.test"]

[vhosts.php]
enabled = true
runtime = "php-fpm"
root = "/srv/fluxheim"
index = "index.php"
allowed_extensions = ["php"]
request_timeout_secs = 30
max_request_body_bytes = "64MiB"
max_response_bytes = "64MiB"

[vhosts.php.fpm]
tcp = "php-fpm:9000"

[vhosts.web]
root = "/srv/fluxheim"
index_files = ["index.html"]
deny_dotfiles = true
