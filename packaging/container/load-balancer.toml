[server]
listen = ["0.0.0.0:8080"]
default_vhost = "default"
trusted_proxies = []

[server.process]
daemon = false
pid_file = "/run/fluxheim/fluxheim.pid"
upgrade_sock = "/run/fluxheim/fluxheim-upgrade.sock"
certificate_reload_sock = "/run/fluxheim/fluxheim-cert-reload.sock"
grace_period_seconds = 2
graceful_shutdown_timeout_seconds = 5

[logging]
level = "info"
format = "json"
target = "stderr"

[logging.access]
enabled = true
include_host = true
include_path = true
request_id = true
request_id_header = "x-request-id"

[headers.request]
enabled = true
strip_inbound_client_ip_headers = true
x_forwarded_for = "replace"
x_real_ip = true
x_forwarded_host = true
x_forwarded_proto = true
forwarded = false
remove = ["x-powered-by"]

[headers.response]
enabled = true
x_content_type_options = "nosniff"
x_frame_options = "DENY"
referrer_policy = "no-referrer"
remove = ["x-powered-by"]

[tls]
enabled = false
backend = "rustls"

[[vhosts]]
name = "default"
hosts = ["localhost", "127.0.0.1", "example.test"]

[vhosts.proxy]
upstreams = ["127.0.0.1:3000", "127.0.0.1:3001"]
upstream_aliases = ["app-a", "app-b"]
upstream_weights = [1, 1]
upstream_tls = false

[vhosts.proxy.load_balance]
selection = "least-connections"
all_down_status = 503
max_iterations = 128
# Optional local restart-persistent runtime state. Mount the parent directory
# as a persistent volume before enabling this in containers.
# runtime_state_file = "/var/lib/fluxheim/load-balancer/default.json"

[vhosts.proxy.load_balance.health_check]
enabled = true
protocol = "tcp"
interval_secs = 5
consecutive_success = 1
consecutive_failure = 2
parallel = true
connect_timeout_secs = 1

[vhosts.proxy.load_balance.retry]
enabled = true
max_retries = 1
methods = ["GET", "HEAD", "OPTIONS"]
statuses = [502, 503, 504]
budget_per_window = 100
budget_window_secs = 1

[vhosts.proxy.load_balance.queue]
max_waiting = 128
timeout_ms = 100
retry_interval_ms = 10

[vhosts.proxy.load_balance.persistence]
enabled = true
mode = "source-ip"
ttl_secs = 300
table_max_entries = 8192
