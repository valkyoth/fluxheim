[server]
listen = ["0.0.0.0:8080"]
default_vhost = "php"
trusted_proxies = []

[server.process]
daemon = false
pid_file = "/run/fluxheim/fluxheim.pid"
upgrade_sock = "/run/fluxheim/fluxheim-upgrade.sock"
certificate_reload_sock = "/run/fluxheim/fluxheim-cert-reload.sock"
grace_period_seconds = 2
graceful_shutdown_timeout_seconds = 5

[server.https_redirect]
enabled = false
status = 308

[server.limits]
max_request_header_bytes = "64KiB"
max_uri_bytes = "8KiB"
max_request_headers = 100
max_request_body_bytes = "64MiB"

[logging]
level = "info"
format = "json"
target = "stderr"

[logging.access]
enabled = true
include_host = true
include_path = true
request_id = true
request_id_header = "x-request-id"

[headers.response]
enabled = true
x_content_type_options = "nosniff"
x_frame_options = "DENY"
referrer_policy = "no-referrer"
remove = ["x-powered-by"]

[tls]
enabled = false
backend = "rustls"

[[vhosts]]
name = "php"
hosts = ["localhost", "php.example.test"]

[vhosts.php]
enabled = true
runtime = "php-fpm"
root = "/srv/fluxheim"
index = "index.php"
allowed_extensions = ["php"]
request_timeout_secs = 30
max_request_body_bytes = "64MiB"
max_response_bytes = "64MiB"
path_info = "disabled"

[vhosts.php.fpm]
mode = "managed"
php_fpm_binary = "/usr/bin/php-fpm"
socket_dir = "/run/fluxheim/php"
workers = 4
max_requests_per_worker = 1000
process_manager = "ondemand"
process_idle_timeout_secs = 10
request_terminate_timeout_secs = 30
request_slowlog_timeout_secs = 10
session_save_path = "/run/fluxheim/php/session"
upload_tmp_dir = "/run/fluxheim/php/upload"

[vhosts.web]
root = "/srv/fluxheim"
index_files = ["index.html", "index.php"]
deny_dotfiles = true
