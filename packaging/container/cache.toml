[server]
listen = ["0.0.0.0:8080"]
default_vhost = "default"
trusted_proxies = []

[server.process]
daemon = false
pid_file = "/run/fluxheim/fluxheim.pid"
upgrade_sock = "/run/fluxheim/fluxheim-upgrade.sock"
certificate_reload_sock = "/run/fluxheim/fluxheim-cert-reload.sock"
grace_period_seconds = 2
graceful_shutdown_timeout_seconds = 5

[logging]
level = "info"
format = "json"
target = "stderr"

[logging.access]
enabled = true
include_host = true
include_path = true
request_id = true
request_id_header = "x-request-id"

[headers.request]
enabled = true
strip_inbound_client_ip_headers = true
x_forwarded_for = "replace"
x_real_ip = true
x_forwarded_host = true
x_forwarded_proto = true
forwarded = false
remove = ["x-powered-by"]

[headers.response]
enabled = true
x_content_type_options = "nosniff"
x_frame_options = "DENY"
referrer_policy = "no-referrer"
remove = ["x-powered-by"]

[tls]
enabled = false
backend = "rustls"

[proxy]
upstreams = ["127.0.0.1:3000"]

[cache]
enabled = true
status_header = "X-Cache-Status"
status_reason_header = "X-Cache-Reason"
methods = ["GET", "HEAD"]
content_types = ["image/*", "text/css", "application/javascript", "font/*"]
image_extensions = ["avif", "css", "gif", "ico", "jpg", "js", "png", "svg", "webp", "woff2"]
max_object_bytes = "32MiB"

[cache.memory]
enabled = true
max_size_bytes = "256MiB"

[[vhosts]]
name = "default"
hosts = ["localhost", "127.0.0.1", "example.test"]

[vhosts.proxy]
upstreams = ["127.0.0.1:3000"]
upstream_tls = false
