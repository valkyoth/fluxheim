[package]
name = "fluxheim"
version = "1.2.3"
edition = "2024"
rust-version = "1.95"
license = "EUPL-1.2"
publish = false
description = "A modular Pingora-based reverse proxy and static web server."

[features]
default = [
    "proxy",
    "web",
    "cache",
    "tls-rustls",
    "security",
]
proxy = [
    "dep:async-trait",
    "dep:bytes",
    "dep:getrandom",
    "dep:http",
    "dep:pingora",
    "dep:ring",
    "dep:rustix",
    "dep:sha2",
    "dep:subtle",
    "dep:tokio",
    "dep:zeroize",
]
load-balancer = ["proxy", "pingora/lb"]
cache = ["dep:bytes", "dep:moka", "dep:sha2", "pingora?/cache"]
web = [
    "dep:bytes",
    "dep:chrono",
    "dep:httpdate",
    "dep:mime_guess",
    "dep:percent-encoding",
]
tls = ["dep:rustix"]
tls-rustls = ["tls", "proxy", "pingora/rustls", "dep:rustls", "rustls/ring"]
tls-openssl = ["tls", "proxy", "pingora/openssl"]
tls-boringssl = ["tls", "proxy", "pingora/boringssl"]
tls-s2n = ["tls", "proxy", "pingora/s2n"]
acme = [
    "tls",
    "dep:instant-acme",
    "dep:serde_json",
    "dep:sha2",
    "dep:x509-parser",
    "dep:zeroize",
    "instant-acme/ring",
]
acme-client = [
    "acme",
    "dep:base64",
    "dep:rcgen",
    "dep:rpassword",
    "dep:tokio",
    "instant-acme/hyper-rustls",
]
metrics = ["dep:prometheus"]
metrics-otlp = ["metrics", "dep:serde_json"]
otel-tracing = ["proxy", "dep:getrandom"]
otel-otlp = ["otel-tracing", "dep:serde_json"]
privacy-mode = ["proxy", "web"]
security = []

# Cargo does not have a separate --group flag. These profile features are
# named feature aliases that enable useful deployment sets.
profile-core = ["proxy", "web", "cache", "tls-rustls", "security"]
profile-static-site = ["proxy", "web", "tls-rustls", "security"]
profile-reverse-proxy = ["proxy", "tls-rustls", "security"]
profile-cache-server = ["proxy", "web", "cache", "tls-rustls", "security"]
profile-load-balancer = [
    "proxy",
    "web",
    "cache",
    "load-balancer",
    "tls-rustls",
    "security",
]
profile-observability = ["profile-core", "metrics", "metrics-otlp", "otel-tracing", "otel-otlp"]
profile-privacy = ["proxy", "web", "tls-rustls", "privacy-mode", "security"]

[dependencies]
arc-swap = "1.9.1"
async-trait = { version = "0.1.89", optional = true }
base64 = { version = "0.22.1", optional = true }
bytes = { version = "1.11.1", optional = true }
chrono = { version = "0.4.44", default-features = false, features = ["clock"], optional = true }
clap = { version = "4.6.1", features = ["derive", "env"] }
env_logger = "0.11.10"
getrandom = { version = "0.4.2", optional = true }
httpdate = { version = "1.0.3", optional = true }
http = { version = "1.4.0", optional = true }
instant-acme = { version = "0.8.5", default-features = false, optional = true }
log = "0.4.29"
mime_guess = { version = "2.0.5", optional = true }
moka = { version = "0.12.15", default-features = false, features = ["sync"], optional = true }
percent-encoding = { version = "2.3.2", optional = true }
pingora = { version = "0.8.0", default-features = false, features = ["proxy"], optional = true }
prometheus = { version = "0.13.4", optional = true }
rcgen = { version = "0.14.7", default-features = false, features = ["pem", "ring"], optional = true }
ring = { version = "0.17.14", optional = true }
rpassword = { version = "7.4.0", optional = true }
rustls = { version = "0.23.40", optional = true }
rustix = { version = "1.1.4", features = ["fs", "process"], optional = true }
sha2 = { version = "0.11.0", optional = true }
subtle = { version = "2.6.1", optional = true }
tokio = { version = "1.52.3", default-features = false, features = ["rt", "time"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", optional = true }
toml = "1.1.2"
x509-parser = { version = "0.18.1", default-features = false, optional = true }
zeroize = { version = "1.8.2", features = ["derive"], optional = true }

[dev-dependencies]
proptest = "1.6.0"

[profile.release]
panic = "abort"

[patch.crates-io]
# Pingora 0.8 rustls listeners do not expose a certificate resolver hook.
# Keep this patch narrow and drop it when upstream exposes equivalent support.
# See docs/pingora-core-patch.md.
pingora-core = { path = "vendor/pingora-core" }
