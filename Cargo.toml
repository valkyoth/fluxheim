[package]
name = "fluxheim"
version = "1.6.3"
edition = "2024"
rust-version = "1.96"
license = "EUPL-1.2"
publish = false
description = "A modular Rust edge gateway for websites, caching, and load balancing."
default-run = "fluxheim"

[workspace]
members = [
    "crates/fluxheim-common",
    "crates/fluxheim-config",
    "crates/fluxheim-cache",
    "crates/fluxheim-compression",
    "crates/fluxheim-geoip",
    "crates/fluxheim-observability",
    "crates/fluxheim-protocol",
    "crates/fluxheim-snapshot",
    "crates/fluxheim-runtime",
    "crates/fluxheim-server",
    "crates/fluxheim-stream",
    "crates/fluxheim-web",
    "crates/fluxheim-php-fpm",
    "crates/fluxheim-load-balancer",
]
resolver = "3"

[features]
default = [
    "proxy",
    "web",
    "cache",
    "tls-rustls",
    "security",
]
ingress = [
    "dep:bytes",
    "dep:http",
    "dep:pingora",
    "dep:tokio",
]
proxy = [
    "ingress",
    "dep:async-trait",
    "dep:base64-ng",
    "fluxheim-config/proxy",
    "dep:percent-encoding",
    "dep:ring",
    "dep:rustix",
    "dep:serde_json",
    "dep:sha2",
    "dep:subtle",
    "dep:ureq",
    "dep:zeroize",
]
compression = ["proxy"]
compression-brotli = ["compression", "fluxheim-compression/brotli"]
compression-gzip = ["compression", "fluxheim-compression/gzip"]
compression-zstd = ["compression", "fluxheim-compression/zstd"]
load-balancer = [
    "proxy",
    "dep:fluxheim-load-balancer",
    "fluxheim-config/load-balancer",
]
stream-proxy = ["proxy", "dep:fluxheim-stream", "fluxheim-config/stream-proxy"]
udp-proxy = ["proxy", "fluxheim-config/udp-proxy"]
traffic-mirror = ["proxy", "fluxheim-config/traffic-mirror"]
geoip = ["proxy", "fluxheim-config/geoip", "fluxheim-geoip/runtime"]
cache = ["dep:bytes", "dep:moka", "dep:sha2", "fluxheim-config/cache", "pingora?/cache"]
web = [
    "dep:bytes",
    "dep:fluxheim-web",
    "dep:httpdate",
    "dep:mime_guess",
    "dep:percent-encoding",
]
tls = ["ingress", "dep:rustix"]
tls-rustls-backend = [
    "tls",
    "fluxheim-config/tls-rustls-backend",
    "pingora/rustls",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:tokio-rustls",
    "fluxheim-load-balancer?/tls-rustls-backend",
]
tls-rustls = ["tls-rustls-backend", "rustls/ring"]
tls-rustls-fips = ["tls-rustls-backend", "dep:aws-lc-rs", "fluxheim-config/tls-rustls-fips", "rustls/fips"]
tls-rustls-iso19790 = ["tls-rustls-fips"]
tls-openssl = [
    "tls",
    "fluxheim-config/tls-openssl",
    "fluxheim-load-balancer?/tls-openssl-backend",
    "pingora/openssl",
    "dep:openssl",
    "dep:tokio-openssl",
]
tls-openssl-fips = ["tls-openssl", "dep:fluxheim-openssl-fips-support", "dep:openssl", "fluxheim-config/tls-openssl-fips"]
tls-openssl-iso19790 = ["tls-openssl-fips"]
acme = [
    "tls",
    "fluxheim-config/acme",
    "dep:instant-acme",
    "dep:serde_json",
    "dep:sha2",
    "dep:x509-parser",
    "dep:zeroize",
    "instant-acme/ring",
]
acme-client = [
    "acme",
    "dep:base64-ng",
    "dep:rcgen",
    "dep:rpassword",
    "dep:tokio",
    "instant-acme/hyper-rustls",
]
metrics = ["dep:prometheus", "fluxheim-load-balancer?/metrics"]
metrics-otlp = [
    "metrics",
    "dep:ureq",
    "fluxheim-config/metrics-otlp",
    "fluxheim-observability/otlp-http",
    "fluxheim-observability/otlp-metrics",
]
otel-tracing = ["proxy", "fluxheim-config/otel-tracing"]
otel-otlp = [
    "otel-tracing",
    "dep:serde_json",
    "dep:ureq",
    "fluxheim-config/otel-otlp",
    "fluxheim-observability/otlp-trace",
]
php = ["proxy", "web"]
php-fpm = [
    "php",
    "dep:fastcgi-client",
    "dep:fluxheim-php-fpm",
    "dep:tokio",
    "fastcgi-client/runtime-tokio",
    "fluxheim-config/php-fpm",
]
privacy-mode = [
    "proxy",
    "web",
    "fluxheim-config/privacy-mode",
    "fluxheim-load-balancer?/privacy-mode",
]
security = []

# Cargo does not have a separate --group flag. These profile features are
# named feature aliases that enable useful deployment sets.
profile-core = ["proxy", "web", "cache", "tls-rustls", "security"]
profile-static-site = ["proxy", "web", "tls-rustls", "security"]
profile-reverse-proxy = ["proxy", "tls-rustls", "security"]
profile-cache-server = ["proxy", "web", "cache", "tls-rustls", "security"]
profile-load-balancer = [
    "proxy",
    "web",
    "cache",
    "compression-gzip",
    "compression-zstd",
    "compression-brotli",
    "load-balancer",
    "tls-rustls",
    "security",
]
profile-observability = ["profile-core", "metrics", "metrics-otlp", "otel-tracing", "otel-otlp"]
profile-privacy = ["proxy", "web", "tls-rustls", "privacy-mode", "security"]
profile-full = [
    "profile-load-balancer",
    "geoip",
    "stream-proxy",
    "traffic-mirror",
]
profile-development = [
    "profile-full",
    "php-fpm",
    "acme-client",
    "metrics",
    "metrics-otlp",
    "otel-tracing",
    "otel-otlp",
]
profile-web-server = [
    "proxy",
    "web",
    "compression-gzip",
    "compression-zstd",
    "compression-brotli",
    "tls-rustls",
    "security",
]
profile-cache-edge = [
    "proxy",
    "cache",
    "compression-gzip",
    "compression-zstd",
    "compression-brotli",
    "tls-rustls",
    "security",
]
profile-proxy-edge = [
    "proxy",
    "compression-gzip",
    "compression-zstd",
    "compression-brotli",
    "tls-rustls",
    "security",
]
profile-load-balancer-edge = [
    "proxy",
    "load-balancer",
    "compression-gzip",
    "compression-zstd",
    "compression-brotli",
    "tls-rustls",
    "security",
]
profile-fips-openssl = ["proxy", "security", "tls-openssl-fips"]
profile-iso19790-openssl = ["profile-fips-openssl", "tls-openssl-iso19790"]
profile-fips-rustls = ["proxy", "security", "tls-rustls-fips"]
profile-iso19790-rustls = ["profile-fips-rustls", "tls-rustls-iso19790"]

[dependencies]
arc-swap = "1.9.1"
async-trait = { version = "0.1.89", optional = true }
aws-lc-rs = { version = "1.17.0", default-features = false, features = ["fips"], optional = true }
base64-ng = { version = "1.0.8", optional = true }
bytes = { version = "1.11.1", optional = true }
clap = { version = "4.6.1", features = ["derive", "env"] }
env_logger = "0.11.10"
fastcgi-client = { version = "0.11.1", default-features = false, optional = true }
fluxheim-common = { path = "crates/fluxheim-common" }
fluxheim-compression = { path = "crates/fluxheim-compression" }
fluxheim-config = { path = "crates/fluxheim-config" }
fluxheim-cache = { path = "crates/fluxheim-cache" }
fluxheim-geoip = { path = "crates/fluxheim-geoip" }
fluxheim-load-balancer = { path = "crates/fluxheim-load-balancer", optional = true }
fluxheim-observability = { path = "crates/fluxheim-observability" }
fluxheim-php-fpm = { path = "crates/fluxheim-php-fpm", optional = true }
fluxheim-protocol = { path = "crates/fluxheim-protocol" }
fluxheim-runtime = { path = "crates/fluxheim-runtime" }
fluxheim-snapshot = { path = "crates/fluxheim-snapshot" }
fluxheim-stream = { path = "crates/fluxheim-stream", optional = true }
fluxheim-web = { path = "crates/fluxheim-web", optional = true }
fluxheim-openssl-fips-support = { path = "vendor/fluxheim-openssl-fips-support", optional = true }
futures = "0.3.32"
getrandom = "0.4.2"
httpdate = { version = "1.0.3", optional = true }
http = { version = "1.4.2", optional = true }
instant-acme = { version = "0.8.5", default-features = false, optional = true }
log = "0.4.32"
mime_guess = { version = "2.0.5", optional = true }
moka = { version = "0.12.15", default-features = false, features = ["sync"], optional = true }
openssl = { version = "0.10.80", optional = true }
percent-encoding = { version = "2.3.2", optional = true }
pingora = { version = "=0.8.0", default-features = false, features = ["proxy"], optional = true }
prometheus = { version = "0.14.0", optional = true }
rcgen = { version = "0.14.7", default-features = false, features = ["pem", "ring"], optional = true }
regex = "1.12.4"
ring = { version = "0.17.14", optional = true }
rpassword = { version = "7.5.4", optional = true }
rustls = { version = "0.23.40", optional = true }
rustls-native-certs = { version = "0.8.3", optional = true }
rustix = { version = "1.1.4", features = ["fs", "net", "process"], optional = true }
sha2 = { version = "0.11.0", optional = true }
subtle = { version = "2.6.1", optional = true }
tokio = { version = "1.52.3", default-features = false, features = ["fs", "io-util", "net", "process", "rt", "time"], optional = true }
tokio-openssl = { version = "0.6.5", optional = true }
tokio-rustls = { version = "0.26.4", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", optional = true }
thiserror = "2.0.18"
toml = "1.1.2"
ureq = { version = "3.3.0", default-features = false, features = ["json", "rustls"], optional = true }
x509-parser = { version = "0.18.1", default-features = false, optional = true }
zeroize = { version = "1.8.2", features = ["derive"], optional = true }

[dev-dependencies]
brotli = { version = "8.0.3", default-features = false, features = ["std"] }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
fluxheim-common = { path = "crates/fluxheim-common", features = ["test-support"] }
fluxheim-config = { path = "crates/fluxheim-config", features = ["test-support"] }
proptest = "1.6.0"
zstd = { version = "0.13.3", default-features = false }

[profile.release]
panic = "abort"
overflow-checks = true

[patch.crates-io]
# Pingora 0.8 rustls listeners do not expose a certificate resolver hook.
# Keep this patch narrow and drop it when upstream exposes equivalent support.
# See docs/pingora-core-patch.md.
pingora-core = { path = "vendor/pingora-core" }

# Pingora 0.8's published OpenSSL compatibility crate forces openssl/vendored.
# Fluxheim's FIPS-capable OpenSSL path must be able to link against the
# operator-installed OpenSSL provider instead, so this patch removes only that
# vendored feature. Drop it when upstream makes vendoring opt-in.
pingora-openssl = { path = "vendor/pingora-openssl" }
