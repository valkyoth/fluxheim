[package]
name = "fluxheim"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "EUPL-1.2"
publish = false
description = "A modular Pingora-based reverse proxy, static web server, and cache."

[features]
default = [
    "proxy",
    "load-balancer",
    "cache",
    "web",
    "tls",
    "acme",
    "metrics",
    "security",
]
proxy = ["dep:async-trait", "dep:http", "dep:pingora", "dep:tokio"]
load-balancer = ["proxy", "pingora/lb"]
cache = ["dep:bytes", "dep:moka", "dep:sha2", "pingora?/cache"]
web = ["dep:bytes", "dep:httpdate", "dep:mime_guess", "dep:percent-encoding"]
tls = ["tls-rustls"]
tls-rustls = ["proxy", "pingora/rustls"]
tls-openssl = ["proxy", "pingora/openssl"]
tls-boringssl = ["proxy", "pingora/boringssl"]
tls-s2n = ["proxy", "pingora/s2n"]
acme = ["tls"]
metrics = ["dep:prometheus"]
security = []

[dependencies]
arc-swap = "1.9.1"
async-trait = { version = "0.1.89", optional = true }
bytes = { version = "1.11.1", optional = true }
clap = { version = "4.6.1", features = ["derive", "env"] }
env_logger = "0.11.10"
httpdate = { version = "1.0.3", optional = true }
http = { version = "1.4.0", optional = true }
log = "0.4.29"
mime_guess = { version = "2.0.5", optional = true }
moka = { version = "0.12.15", default-features = false, features = ["sync"], optional = true }
percent-encoding = { version = "2.3.2", optional = true }
pingora = { version = "0.8.0", default-features = false, features = ["proxy"], optional = true }
prometheus = { version = "0.14.0", optional = true }
sha2 = { version = "0.11.0", optional = true }
tokio = { version = "1.52.2", default-features = false, features = ["time"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"

[dev-dependencies]
