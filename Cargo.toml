[package]
name = "fluxheim"
version = "1.7.12"
edition = "2024"
rust-version = "1.97.0"
license = "EUPL-1.2"
publish = false
description = "A modular Rust edge gateway for websites, caching, and load balancing."
default-run = "fluxheim"

[workspace]
members = [
    "crates/fluxheim-common",
    "crates/fluxheim-acme",
    "crates/fluxheim-config",
    "crates/fluxheim-cache",
    "crates/fluxheim-compression",
    "crates/fluxheim-geoip",
    "crates/fluxheim-headers",
    "crates/fluxheim-observability",
    "crates/fluxheim-protocol",
    "crates/fluxheim-snapshot",
    "crates/fluxheim-runtime",
    "crates/fluxheim-server",
    "crates/fluxheim-stream",
    "crates/fluxheim-systemd",
    "crates/fluxheim-tls",
    "crates/fluxheim-web",
    "crates/fluxheim-php-fpm",
    "crates/fluxheim-load-balancer",
    "crates/fluxheim-wasm",
]
resolver = "3"

[features]
default = [
    "proxy",
    "web",
    "cache",
    "tls-rustls",
    "security",
]
ingress = [
    "dep:bytes",
    "dep:http",
    "dep:tokio",
]
pingora-compat = []
proxy = [
    "ingress",
    "dep:async-trait",
    "dep:base64-ng",
    "dep:fluxheim-systemd",
    "dep:libsystemd",
    "fluxheim-config/proxy",
    "dep:percent-encoding",
    "dep:ring",
    "dep:rustix",
    "dep:serde_json",
    "dep:sha2",
    "dep:sanitization",
    "dep:ureq",
    "dep:zeroize",
    "fluxheim-server/auth-request",
]
compression = ["proxy"]
compression-brotli = ["compression", "fluxheim-compression/brotli", "fluxheim-server/compression-brotli"]
compression-gzip = ["compression", "fluxheim-compression/gzip", "fluxheim-server/compression-gzip"]
compression-zstd = ["compression", "fluxheim-compression/zstd", "fluxheim-server/compression-zstd"]
load-balancer = [
    "proxy",
    "dep:fluxheim-load-balancer",
    "fluxheim-config/load-balancer",
    "fluxheim-server/load-balancer",
]
stream-proxy = ["proxy", "dep:fluxheim-stream", "fluxheim-config/stream-proxy"]
udp-proxy = ["proxy", "fluxheim-config/udp-proxy"]
traffic-mirror = ["proxy", "fluxheim-config/traffic-mirror", "fluxheim-server/traffic-mirror"]
geoip = ["proxy", "fluxheim-config/geoip", "fluxheim-server/geoip"]
wasm = ["dep:fluxheim-wasm", "fluxheim-config/wasm", "fluxheim-server/wasm", "fluxheim-wasm/runtime"]
wasm-proxy-abi = ["wasm", "fluxheim-config/wasm-proxy-abi", "fluxheim-server/wasm-proxy-abi", "fluxheim-wasm/proxy-abi"]
wasm-wasi = ["wasm", "fluxheim-config/wasm-wasi", "fluxheim-server/wasm-wasi", "fluxheim-wasm/wasi"]
cache = ["dep:bytes", "dep:moka", "dep:sha2", "fluxheim-config/cache", "fluxheim-server/openbao-cache-encryption"]
web = [
    "dep:bytes",
    "dep:fluxheim-web",
    "dep:httpdate",
    "dep:mime_guess",
    "dep:percent-encoding",
]
tls = ["ingress", "dep:rustix"]
tls-rustls-backend = [
    "tls",
    "fluxheim-config/tls-rustls-backend",
    "fluxheim-server/tls-rustls-backend",
    "fluxheim-tls/tls-rustls-backend",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:tokio-rustls",
    "fluxheim-load-balancer?/tls-rustls-backend",
]
tls-rustls = ["tls-rustls-backend", "rustls/ring", "tokio-rustls/ring", "fluxheim-server/tls-rustls", "fluxheim-tls/tls-rustls"]
tls-rustls-fips = ["tls-rustls-backend", "dep:aws-lc-rs", "fluxheim-config/tls-rustls-fips", "fluxheim-server/tls-rustls-fips", "fluxheim-tls/tls-rustls-fips", "rustls/fips", "tokio-rustls/fips"]
tls-rustls-iso19790 = ["tls-rustls-fips"]
tls-openssl = [
    "tls",
    "fluxheim-config/tls-openssl",
    "fluxheim-server/tls-openssl",
    "fluxheim-tls/tls-openssl",
    "fluxheim-load-balancer?/tls-openssl-backend",
    "dep:openssl",
    "dep:tokio-openssl",
]
tls-openssl-fips = ["tls-openssl", "dep:fluxheim-openssl-fips-support", "dep:openssl", "fluxheim-config/tls-openssl-fips", "fluxheim-server/tls-openssl-fips", "fluxheim-tls/tls-openssl-fips"]
tls-openssl-iso19790 = ["tls-openssl-fips"]
acme = [
    "tls",
    "dep:fluxheim-acme",
    "fluxheim-config/acme",
    "fluxheim-server/acme",
    "fluxheim-tls/acme",
]
acme-client = [
    "acme",
    "fluxheim-acme/acme-client",
    "dep:rpassword",
    "dep:sanitization",
    "dep:tokio",
]
metrics = [
    "dep:prometheus",
    "dep:sanitization",
    "dep:sha2",
    "fluxheim-observability/metrics-secret",
    "fluxheim-load-balancer?/metrics",
]
metrics-otlp = [
    "metrics",
    "dep:ureq",
    "fluxheim-config/metrics-otlp",
    "fluxheim-observability/otlp-http",
    "fluxheim-observability/otlp-metrics",
]
otel-tracing = ["proxy", "fluxheim-config/otel-tracing", "fluxheim-server/otel-tracing"]
otel-otlp = [
    "otel-tracing",
    "dep:serde_json",
    "dep:ureq",
    "fluxheim-config/otel-otlp",
    "fluxheim-observability/otlp-trace",
]
php = ["proxy", "web"]
php-fpm = [
    "php",
    "dep:fastcgi-client",
    "dep:fluxheim-php-fpm",
    "dep:tokio",
    "fastcgi-client/runtime-tokio",
    "fluxheim-config/php-fpm",
    "fluxheim-server/php-fpm",
]
privacy-mode = [
    "proxy",
    "web",
    "fluxheim-config/privacy-mode",
    "fluxheim-headers/privacy-mode",
    "fluxheim-load-balancer?/privacy-mode",
    "fluxheim-server/privacy-mode",
]
security = []

# Cargo does not have a separate --group flag. These profile features are
# named feature aliases that enable useful deployment sets.
profile-core = ["proxy", "web", "cache", "tls-rustls", "security"]
profile-static-site = ["proxy", "web", "tls-rustls", "security"]
profile-reverse-proxy = ["proxy", "tls-rustls", "security"]
profile-cache-server = ["proxy", "web", "cache", "tls-rustls", "security"]
profile-load-balancer = [
    "proxy",
    "web",
    "cache",
    "compression-gzip",
    "compression-zstd",
    "compression-brotli",
    "load-balancer",
    "tls-rustls",
    "security",
]
profile-observability = ["profile-core", "metrics", "metrics-otlp", "otel-tracing", "otel-otlp"]
profile-privacy = ["proxy", "web", "tls-rustls", "privacy-mode", "security"]
profile-full = [
    "profile-load-balancer",
    "geoip",
    "stream-proxy",
    "traffic-mirror",
]
profile-development = [
    "profile-full",
    "php-fpm",
    "acme-client",
    "metrics",
    "metrics-otlp",
    "otel-tracing",
    "otel-otlp",
]
profile-web-server = [
    "proxy",
    "web",
    "compression-gzip",
    "compression-zstd",
    "compression-brotli",
    "tls-rustls",
    "security",
]
profile-cache-edge = [
    "proxy",
    "cache",
    "compression-gzip",
    "compression-zstd",
    "compression-brotli",
    "tls-rustls",
    "security",
]
profile-proxy-edge = [
    "proxy",
    "compression-gzip",
    "compression-zstd",
    "compression-brotli",
    "tls-rustls",
    "security",
]
profile-load-balancer-edge = [
    "proxy",
    "load-balancer",
    "compression-gzip",
    "compression-zstd",
    "compression-brotli",
    "tls-rustls",
    "security",
]
profile-fips-openssl = ["proxy", "security", "tls-openssl-fips"]
profile-iso19790-openssl = ["profile-fips-openssl", "tls-openssl-iso19790"]
profile-fips-rustls = ["proxy", "security", "tls-rustls-fips"]
profile-iso19790-rustls = ["profile-fips-rustls", "tls-rustls-iso19790"]

[dependencies]
arc-swap = "1.9.2"
async-trait = { version = "0.1.89", optional = true }
aws-lc-rs = { version = "1.17.1", default-features = false, features = ["fips"], optional = true }
base64-ng = { version = "1.3.7", optional = true }
bytes = { version = "1.12.1", optional = true }
clap = { version = "4.6.1", features = ["derive", "env"] }
env_logger = "0.11.11"
fastcgi-client = { version = "0.11.1", default-features = false, optional = true }
fluxheim-common = { path = "crates/fluxheim-common" }
fluxheim-acme = { path = "crates/fluxheim-acme", optional = true }
fluxheim-compression = { path = "crates/fluxheim-compression" }
fluxheim-config = { path = "crates/fluxheim-config" }
fluxheim-cache = { path = "crates/fluxheim-cache" }
fluxheim-headers = { path = "crates/fluxheim-headers" }
fluxheim-load-balancer = { path = "crates/fluxheim-load-balancer", optional = true }
fluxheim-observability = { path = "crates/fluxheim-observability" }
fluxheim-php-fpm = { path = "crates/fluxheim-php-fpm", optional = true }
fluxheim-protocol = { path = "crates/fluxheim-protocol" }
fluxheim-runtime = { path = "crates/fluxheim-runtime" }
fluxheim-server = { path = "crates/fluxheim-server" }
fluxheim-snapshot = { path = "crates/fluxheim-snapshot" }
fluxheim-stream = { path = "crates/fluxheim-stream", optional = true }
fluxheim-tls = { path = "crates/fluxheim-tls" }
fluxheim-web = { path = "crates/fluxheim-web", optional = true }
fluxheim-wasm = { path = "crates/fluxheim-wasm", optional = true }
fluxheim-openssl-fips-support = { path = "vendor/fluxheim-openssl-fips-support", optional = true }
futures = "0.3.32"
getrandom = "0.4.3"
httpdate = { version = "1.0.3", optional = true }
http = { version = "1.4.2", optional = true }
log = "0.4.33"
mime_guess = { version = "2.0.5", optional = true }
moka = { version = "0.12.15", default-features = false, features = ["sync"], optional = true }
openssl = { version = "0.10.81", optional = true }
percent-encoding = { version = "2.3.2", optional = true }
prometheus = { version = "0.14.0", optional = true }
regex = "1.13.0"
ring = { version = "0.17.14", optional = true }
rpassword = { version = "7.5.4", optional = true }
rustls = { version = "0.23.41", optional = true, default-features = false, features = ["std", "tls12", "logging"] }
rustls-native-certs = { version = "0.8.4", optional = true }
rustix = { version = "1.1.4", features = ["fs", "net", "process"], optional = true }
sha2 = { version = "0.11.0", optional = true }
sanitization = { version = "1.2.4", features = ["alloc"], optional = true }
tokio = { version = "1.52.3", default-features = false, features = ["fs", "io-util", "net", "process", "rt", "rt-multi-thread", "signal", "time"], optional = true }
tokio-openssl = { version = "0.6.5", optional = true }
tokio-rustls = { version = "0.26.4", optional = true, default-features = false, features = ["logging", "tls12"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", optional = true }
thiserror = "2.0.18"
toml = "1.1.2"
ureq = { version = "3.3.0", default-features = false, features = ["json", "rustls"], optional = true }
zeroize = { version = "1.9.0", features = ["derive"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
fluxheim-systemd = { path = "crates/fluxheim-systemd", optional = true }
libsystemd = { version = "0.7.2", optional = true }

[dev-dependencies]
brotli = { version = "8.0.4", default-features = false, features = ["std"] }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
fluxheim-common = { path = "crates/fluxheim-common", features = ["test-support"] }
fluxheim-config = { path = "crates/fluxheim-config", features = ["test-support"] }
proptest = "1.6.0"
rcgen = { version = "0.14.8", default-features = false, features = ["pem", "ring"] }
tempfile = "3.27.0"
zstd = { version = "0.13.3", default-features = false }

[profile.release]
panic = "abort"
overflow-checks = true

[patch.crates-io]
# Narrow downstream API patch: lets Fluxheim persist an ACME account key before
# remote activation while retaining configured contacts and EAB parameters.
instant-acme = { path = "vendor/instant-acme" }
