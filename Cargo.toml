[package]
name = "fluxheim"
version = "1.4.0-dev"
edition = "2024"
rust-version = "1.95"
license = "EUPL-1.2"
publish = false
description = "A modular Pingora-based reverse proxy and static web server."
default-run = "fluxheim"

[features]
default = [
    "proxy",
    "web",
    "cache",
    "tls-rustls",
    "security",
]
ingress = [
    "dep:bytes",
    "dep:http",
    "dep:pingora",
    "dep:tokio",
]
proxy = [
    "ingress",
    "dep:async-trait",
    "dep:base64-ng",
    "dep:ring",
    "dep:rustix",
    "dep:serde_json",
    "dep:sha2",
    "dep:subtle",
    "dep:ureq",
    "dep:zeroize",
]
compression = ["proxy"]
compression-gzip = ["compression", "dep:flate2"]
load-balancer = ["proxy", "pingora/lb"]
cache = ["dep:bytes", "dep:moka", "dep:sha2", "pingora?/cache"]
web = [
    "dep:bytes",
    "dep:chrono",
    "dep:httpdate",
    "dep:mime_guess",
    "dep:percent-encoding",
]
tls = ["ingress", "dep:rustix"]
tls-rustls-backend = ["tls", "pingora/rustls", "dep:rustls"]
tls-rustls = ["tls-rustls-backend", "rustls/ring"]
tls-rustls-fips = ["tls-rustls-backend", "dep:aws-lc-rs", "rustls/fips"]
tls-rustls-iso19790 = ["tls-rustls-fips"]
tls-openssl = ["tls", "pingora/openssl"]
tls-openssl-fips = ["tls-openssl", "dep:fluxheim-openssl-fips-support", "dep:openssl"]
tls-openssl-iso19790 = ["tls-openssl-fips"]
tls-boringssl = ["tls", "pingora/boringssl"]
tls-s2n = ["tls", "pingora/s2n"]
acme = [
    "tls",
    "dep:instant-acme",
    "dep:serde_json",
    "dep:sha2",
    "dep:x509-parser",
    "dep:zeroize",
    "instant-acme/ring",
]
acme-client = [
    "acme",
    "dep:base64-ng",
    "dep:rcgen",
    "dep:rpassword",
    "dep:tokio",
    "instant-acme/hyper-rustls",
]
metrics = ["dep:prometheus"]
metrics-otlp = ["metrics", "dep:serde_json", "dep:ureq"]
otel-tracing = ["proxy"]
otel-otlp = ["otel-tracing", "dep:serde_json", "dep:ureq"]
php = ["proxy", "web"]
php-fpm = ["php", "dep:fastcgi-client", "dep:tokio", "fastcgi-client/runtime-tokio"]
privacy-mode = ["proxy", "web"]
security = []

# Cargo does not have a separate --group flag. These profile features are
# named feature aliases that enable useful deployment sets.
profile-core = ["proxy", "web", "cache", "tls-rustls", "security"]
profile-static-site = ["proxy", "web", "tls-rustls", "security"]
profile-reverse-proxy = ["proxy", "tls-rustls", "security"]
profile-cache-server = ["proxy", "web", "cache", "tls-rustls", "security"]
profile-load-balancer = [
    "proxy",
    "web",
    "cache",
    "load-balancer",
    "tls-rustls",
    "security",
]
profile-observability = ["profile-core", "metrics", "metrics-otlp", "otel-tracing", "otel-otlp"]
profile-privacy = ["proxy", "web", "tls-rustls", "privacy-mode", "security"]
profile-full = [
    "profile-load-balancer",
]
profile-development = [
    "profile-full",
    "php-fpm",
    "acme-client",
    "metrics",
    "metrics-otlp",
    "otel-tracing",
    "otel-otlp",
]
profile-web-server = ["proxy", "web", "tls-rustls", "security"]
profile-cache-edge = ["proxy", "cache", "tls-rustls", "security"]
profile-proxy-edge = ["proxy", "tls-rustls", "security"]
profile-load-balancer-edge = ["proxy", "load-balancer", "tls-rustls", "security"]
profile-fips-openssl = ["proxy", "security", "tls-openssl-fips"]
profile-iso19790-openssl = ["profile-fips-openssl", "tls-openssl-iso19790"]
profile-fips-rustls = ["proxy", "security", "tls-rustls-fips"]
profile-iso19790-rustls = ["profile-fips-rustls", "tls-rustls-iso19790"]

[dependencies]
arc-swap = "1.9.1"
async-trait = { version = "0.1.89", optional = true }
aws-lc-rs = { version = "1.17.0", default-features = false, features = ["fips"], optional = true }
base64-ng = { version = "1.0.0", optional = true }
bytes = { version = "1.11.1", optional = true }
chrono = { version = "0.4.44", default-features = false, features = ["clock"], optional = true }
clap = { version = "4.6.1", features = ["derive", "env"] }
env_logger = "0.11.10"
fastcgi-client = { version = "0.11.1", default-features = false, optional = true }
fluxheim-openssl-fips-support = { path = "vendor/fluxheim-openssl-fips-support", optional = true }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"], optional = true }
getrandom = "0.4.2"
httpdate = { version = "1.0.3", optional = true }
http = { version = "1.4.0", optional = true }
instant-acme = { version = "0.8.5", default-features = false, optional = true }
log = "0.4.29"
mime_guess = { version = "2.0.5", optional = true }
moka = { version = "0.12.15", default-features = false, features = ["sync"], optional = true }
openssl = { version = "0.10.80", optional = true }
percent-encoding = { version = "2.3.2", optional = true }
pingora = { version = "0.8.0", default-features = false, features = ["proxy"], optional = true }
prometheus = { version = "0.13.4", optional = true }
rcgen = { version = "0.14.7", default-features = false, features = ["pem", "ring"], optional = true }
ring = { version = "0.17.14", optional = true }
rpassword = { version = "7.4.0", optional = true }
rustls = { version = "0.23.40", optional = true }
rustix = { version = "1.1.4", features = ["fs", "net", "process"], optional = true }
sha2 = { version = "0.11.0", optional = true }
subtle = { version = "2.6.1", optional = true }
tokio = { version = "1.52.3", default-features = false, features = ["fs", "io-util", "net", "rt", "time"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", optional = true }
toml = "1.1.2"
ureq = { version = "3.3.0", default-features = false, features = ["json", "rustls"], optional = true }
x509-parser = { version = "0.18.1", default-features = false, optional = true }
zeroize = { version = "1.8.2", features = ["derive"], optional = true }

[dev-dependencies]
proptest = "1.6.0"

[profile.release]
panic = "abort"

[patch.crates-io]
# Pingora 0.8 rustls listeners do not expose a certificate resolver hook.
# Keep this patch narrow and drop it when upstream exposes equivalent support.
# See docs/pingora-core-patch.md.
pingora-core = { path = "vendor/pingora-core" }

# Pingora 0.8's published OpenSSL compatibility crate forces openssl/vendored.
# Fluxheim's FIPS-capable OpenSSL path must be able to link against the
# operator-installed OpenSSL provider instead, so this patch removes only that
# vendored feature. Drop it when upstream makes vendoring opt-in.
pingora-openssl = { path = "vendor/pingora-openssl" }
